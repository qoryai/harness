apiVersion: qory.dev/v1alpha1
name: Software factory
summary: Agents change code in your repositories. Each ticket needs a repository.
description: |-
  Each ticket comes from a work source, such as an issue tracker. Agents take the ticket through the stages, and at the end of each stage a member approves the result before the next stage starts. Changes go to your repositories through the destination you connect.

  You connect: where work comes from, where changes go, and a model.
type: qory.software
stack: software
process:
  schema: qory.process/v1
  machine: default
  stages:
    - id: st_r79kph11eg
      name: Explore
      description: >-
        Agents read the ticket, its comments and the target, and write questions
        for members about what the ticket leaves open. The stage ends with a proposal: the
        general direction for solving the ticket.
      inputs: []
      sequence:
        - workflow: explore-a-ticket
      outputs:
        - type: proposal
          required: true
      gate: {kind: person, approvers: members}
    - id: st_p9w5cvh311
      name: Shape
      description: >-
        Agents turn the ticket and the proposal into a spec of the rules that change, and
        into acceptance criteria: at most seven statements of when the work is done. Where
        the change needs them, agents record technical decisions, draw mockups of changed
        screens, and write demo scenarios for what a person sees. The stage ends with a spec
        and acceptance criteria, plus any of those.
      inputs:
        - type: proposal
          required: false
      sequence:
        - workflow: shape-a-ticket
      outputs:
        - type: spec
          required: true
        - type: acceptance-criteria
          required: true
        - type: decision-record
          required: false
        - type: mockup
          required: false
        - type: demo-scenarios
          required: false
      gate: {kind: person, approvers: members}
    - id: st_6ns22c4pav
      name: Build
      description: >-
        Agents change the code in the target's repositories so that it meets the
        spec. The stage ends with the change committed on one branch in each repository.
      inputs: []
      sequence: []
      outputs: []
      gate: {kind: person, approvers: members}
    - id: st_m1mqbeywdg
      name: Verify
      description: >-
        Agents test the change against the acceptance criteria. The stage
        ends with the test results and the evidence, such as screenshots and a demo video.
      inputs: []
      sequence: []
      outputs: []
      gate: {kind: person, approvers: members}
    - id: st_k9kpv17xmy
      name: Release
      description: >-
        Agents send the change through the destination you connect, for example
        as a pull request in each repository. The stage ends when the destination has the
        change for each repository.
      inputs: []
      sequence: []
      outputs: []
      gate: {kind: person, approvers: members}
artifact_types:
  - name: acceptance-criteria
  - name: verification
  - name: mockup
  - name: screenshot
  - name: demo-video
  - name: walkthrough
  - name: decision-record
  - name: spec
    base_view: document
    size_limit: 1048576
    max_files: 1
  - name: demo-scenarios
    base_view: document
    size_limit: 1048576
    max_files: 1
  - name: submission
    base_view: structured
    size_limit: 1048576
    max_files: 1
    # The same JSON Schema is in running-a-software-workflow/schemas/submission.schema.json.
    json_schema:
      {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "title": "Submission, version 1",
        "description": "A session's branch, commits, draft, text and verdict.",
        "type": "object",
        "required": [
          "ref",
          "repositories",
          "verdict"
        ],
        "additionalProperties": false,
        "properties": {
          "ref": {
            "title": "Branch",
            "type": "string",
            "pattern": "^qory/wi_[A-Za-z0-9_-]{1,64}$"
          },
          "verdict": {
            "enum": [
              "passed",
              "changes-requested",
              "escalate",
              "none"
            ]
          },
          "repositories": {
            "type": "array",
            "minItems": 1,
            "maxItems": 20,
            "items": {
              "$ref": "#/$defs/repository"
            }
          },
          "text": {
            "$ref": "#/$defs/text"
          }
        },
        "$defs": {
          "repository": {
            "type": "object",
            "required": [
              "system",
              "path",
              "commit",
              "draft"
            ],
            "additionalProperties": false,
            "properties": {
              "system": {
                "type": "string",
                "pattern": "^[a-z0-9.-]{0,252}[a-z0-9-]$"
              },
              "path": {
                "type": "string",
                "maxLength": 200,
                "pattern": "^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$",
                "not": {
                  "pattern": "(^|/)(\\.\\.?|\\.[Gg][Ii][Tt])(/|$)"
                }
              },
              "commit": {
                "title": "Commit",
                "$ref": "#/$defs/commit"
              },
              "commit_url": {
                "title": "Commit link",
                "type": "string",
                "maxLength": 2048,
                "pattern": "^https://\\S+$"
              },
              "draft": {
                "oneOf": [
                  {
                    "$ref": "#/$defs/draft"
                  },
                  {
                    "$ref": "#/$defs/no_draft"
                  }
                ]
              }
            }
          },
          "draft": {
            "type": "object",
            "required": [
              "number",
              "url",
              "title",
              "state",
              "action"
            ],
            "additionalProperties": false,
            "properties": {
              "number": {
                "title": "Draft",
                "type": "integer",
                "minimum": 1
              },
              "url": {
                "title": "Draft link",
                "type": "string",
                "maxLength": 2048,
                "pattern": "^https://\\S+$"
              },
              "title": {
                "title": "Draft title",
                "type": "string",
                "minLength": 1,
                "maxLength": 256,
                "pattern": "^[^\\x00-\\x1f\\x7f]+$"
              },
              "state": {
                "enum": [
                  "draft",
                  "open"
                ]
              },
              "action": {
                "enum": [
                  "opened",
                  "updated",
                  "kept"
                ]
              }
            }
          },
          "no_draft": {
            "type": "object",
            "required": [
              "none"
            ],
            "additionalProperties": false,
            "properties": {
              "none": {
                "title": "No draft",
                "enum": [
                  "not-passed",
                  "no-text",
                  "escalated",
                  "no-program"
                ]
              }
            }
          },
          "text": {
            "type": "object",
            "required": [
              "title",
              "description"
            ],
            "additionalProperties": false,
            "properties": {
              "title": {
                "type": "string",
                "minLength": 1,
                "maxLength": 256,
                "pattern": "^[^\\n]+$"
              },
              "description": {
                "type": "string",
                "minLength": 1,
                "maxLength": 16384
              }
            }
          },
          "commit": {
            "type": "string",
            "pattern": "^([0-9a-f]{40}|[0-9a-f]{64})$"
          }
        }
      }
  - name: build-plan
    base_view: document
    size_limit: 1048576
    max_files: 1
  - name: build-report
    base_view: document
    size_limit: 1048576
    max_files: 1
  - name: build-ledger
    base_view: structured
    size_limit: 1048576
    max_files: 1
    withdrawable: false
    # The same JSON Schema is in running-a-software-workflow/schemas/build-ledger.schema.json.
    json_schema:
      {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "title": "Build ledger, version 1",
        "description": "Build's steps with their input hashes, and escalations.",
        "type": "object",
        "required": [
          "steps",
          "escalations"
        ],
        "additionalProperties": false,
        "properties": {
          "steps": {
            "type": "array",
            "maxItems": 100,
            "items": {
              "$ref": "#/$defs/step"
            }
          },
          "escalations": {
            "type": "array",
            "maxItems": 20,
            "items": {
              "$ref": "#/$defs/escalation"
            }
          }
        },
        "$defs": {
          "step": {
            "type": "object",
            "required": [
              "id",
              "pass",
              "kind",
              "workflow",
              "inputs",
              "state",
              "base",
              "attempts",
              "replays",
              "started_at"
            ],
            "additionalProperties": false,
            "properties": {
              "id": {
                "type": "string",
                "maxLength": 64,
                "pattern": "^(plan|checks|small-change|deliverable:d-[1-9][0-9]{0,2}|fix:[a-z0-9-]{1,40}|script:scenario-[1-9][0-9]?(#[23])?)$"
              },
              "pass": {
                "type": "integer",
                "minimum": 1,
                "maximum": 100
              },
              "kind": {
                "enum": [
                  "plan",
                  "checks",
                  "deliverable",
                  "fix",
                  "script",
                  "small-change"
                ]
              },
              "workflow": {
                "$ref": "#/$defs/workflow"
              },
              "inputs": {
                "$ref": "#/$defs/sha256"
              },
              "state": {
                "enum": [
                  "running",
                  "done",
                  "failed"
                ]
              },
              "base": {
                "$ref": "#/$defs/commit"
              },
              "commit": {
                "$ref": "#/$defs/commit"
              },
              "script_sha256": {
                "$ref": "#/$defs/sha256"
              },
              "attempts": {
                "type": "array",
                "maxItems": 3,
                "items": {
                  "$ref": "#/$defs/attempt"
                }
              },
              "pushed": {
                "type": "array",
                "maxItems": 4,
                "items": {
                  "$ref": "#/$defs/version"
                }
              },
              "report": {
                "type": "string",
                "maxLength": 8192
              },
              "replays": {
                "type": "integer",
                "minimum": 0,
                "maximum": 100
              },
              "started_at": {
                "$ref": "#/$defs/time"
              },
              "ended_at": {
                "$ref": "#/$defs/time"
              }
            },
            "allOf": [
              {
                "if": {
                  "properties": {
                    "state": {
                      "const": "done"
                    }
                  }
                },
                "then": {
                  "required": [
                    "commit",
                    "ended_at"
                  ]
                }
              },
              {
                "if": {
                  "properties": {
                    "kind": {
                      "const": "script"
                    },
                    "state": {
                      "const": "done"
                    }
                  }
                },
                "then": {
                  "required": [
                    "script_sha256"
                  ]
                }
              }
            ]
          },
          "attempt": {
            "type": "object",
            "required": [
              "agent",
              "role",
              "tier",
              "model"
            ],
            "additionalProperties": false,
            "properties": {
              "agent": {
                "$ref": "#/$defs/name"
              },
              "role": {
                "$ref": "#/$defs/name"
              },
              "tier": {
                "enum": [
                  "light",
                  "balanced",
                  "thinking"
                ]
              },
              "model": {
                "type": "string",
                "minLength": 1,
                "maxLength": 100,
                "pattern": "^[!-~]+$"
              }
            }
          },
          "escalation": {
            "type": "object",
            "required": [
              "workflow",
              "reason",
              "at"
            ],
            "additionalProperties": false,
            "properties": {
              "workflow": {
                "$ref": "#/$defs/workflow"
              },
              "reason": {
                "enum": [
                  "short-path",
                  "plan-limit",
                  "ledger-full",
                  "check-judged-wrong",
                  "findings-open",
                  "preflight",
                  "no-agent",
                  "other"
                ]
              },
              "detail": {
                "type": "string",
                "maxLength": 1000
              },
              "at": {
                "$ref": "#/$defs/time"
              }
            }
          },
          "version": {
            "type": "object",
            "required": [
              "type",
              "name",
              "version"
            ],
            "additionalProperties": false,
            "properties": {
              "type": {
                "$ref": "#/$defs/name"
              },
              "name": {
                "$ref": "#/$defs/name"
              },
              "version": {
                "type": "integer",
                "minimum": 1,
                "maximum": 999999
              }
            }
          },
          "name": {
            "type": "string",
            "pattern": "^[a-z0-9]+(-[a-z0-9]+)*$",
            "maxLength": 32
          },
          "workflow": {
            "type": "string",
            "pattern": "^[a-z][a-z0-9-]{0,54}$"
          },
          "commit": {
            "type": "string",
            "pattern": "^([0-9a-f]{40}|[0-9a-f]{64})$"
          },
          "sha256": {
            "type": "string",
            "pattern": "^[0-9a-f]{64}$"
          },
          "time": {
            "type": "string",
            "format": "date-time",
            "maxLength": 40,
            "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}[Tt][0-9:.]+([Zz]|[+-][0-9]{2}:[0-9]{2})$"
          }
        }
      }
  - name: acceptance-lock
    base_view: structured
    size_limit: 1048576
    max_files: 1
    withdrawable: false
    # The same JSON Schema is in running-a-software-workflow/schemas/acceptance-lock.schema.json.
    json_schema:
      {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "title": "Acceptance lock, version 1",
        "description": "The hashes of the locked acceptance checks.",
        "type": "object",
        "required": [
          "criteria",
          "start_commit",
          "commit",
          "checks"
        ],
        "additionalProperties": false,
        "properties": {
          "criteria": {
            "type": "object",
            "required": [
              "version"
            ],
            "additionalProperties": false,
            "properties": {
              "version": {
                "type": "integer",
                "minimum": 1
              },
              "decision": {
                "type": "string",
                "minLength": 1,
                "maxLength": 64,
                "pattern": "^[A-Za-z0-9_-]+$"
              }
            }
          },
          "start_commit": {
            "$ref": "#/$defs/commit"
          },
          "commit": {
            "$ref": "#/$defs/commit"
          },
          "checks": {
            "type": "array",
            "minItems": 1,
            "maxItems": 50,
            "items": {
              "$ref": "#/$defs/check"
            }
          },
          "support": {
            "type": "array",
            "maxItems": 50,
            "items": {
              "$ref": "#/$defs/file"
            }
          }
        },
        "$defs": {
          "check": {
            "type": "object",
            "required": [
              "criterion",
              "path",
              "sha256",
              "command",
              "failed_with"
            ],
            "additionalProperties": false,
            "properties": {
              "criterion": {
                "type": "string",
                "pattern": "^ac-[1-9][0-9]{0,3}$"
              },
              "repository": {
                "type": "string",
                "maxLength": 200,
                "pattern": "^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$",
                "not": {
                  "pattern": "(^|/)\\.\\.?(/|$)"
                }
              },
              "path": {
                "$ref": "#/$defs/path"
              },
              "sha256": {
                "$ref": "#/$defs/sha256"
              },
              "command": {
                "type": "string",
                "minLength": 1,
                "maxLength": 1000
              },
              "failed_with": {
                "type": "integer",
                "minimum": 1,
                "maximum": 255
              }
            }
          },
          "file": {
            "type": "object",
            "required": [
              "path",
              "sha256"
            ],
            "additionalProperties": false,
            "properties": {
              "repository": {
                "type": "string",
                "maxLength": 200,
                "pattern": "^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$",
                "not": {
                  "pattern": "(^|/)\\.\\.?(/|$)"
                }
              },
              "path": {
                "$ref": "#/$defs/path"
              },
              "sha256": {
                "$ref": "#/$defs/sha256"
              }
            }
          },
          "path": {
            "type": "string",
            "maxLength": 1000,
            "pattern": "^[^/\\s][^\\s]*$",
            "not": {
              "pattern": "(^|/)\\.\\.?(/|$)"
            }
          },
          "commit": {
            "type": "string",
            "pattern": "^([0-9a-f]{40}|[0-9a-f]{64})$"
          },
          "sha256": {
            "type": "string",
            "pattern": "^[0-9a-f]{64}$"
          }
        }
      }
  - name: demo-script
    base_view: structured
    size_limit: 1048576
    max_files: 1
    # The same JSON Schema is in running-a-software-workflow/schemas/demo-script.schema.json.
    json_schema:
      {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "title": "Demo script, version 1",
        "description": "The browser actions of one approved demo scenario.",
        "type": "object",
        "required": [
          "scenario",
          "title",
          "evidence",
          "source",
          "setup",
          "steps"
        ],
        "additionalProperties": false,
        "properties": {
          "scenario": {
            "type": "string",
            "pattern": "^scenario-[1-9][0-9]?$"
          },
          "title": {
            "type": "string",
            "minLength": 1,
            "maxLength": 500,
            "pattern": "^[^\\n]+$"
          },
          "evidence": {
            "enum": [
              "film",
              "pictures"
            ]
          },
          "source": {
            "type": "object",
            "required": [
              "version"
            ],
            "additionalProperties": false,
            "properties": {
              "version": {
                "type": "integer",
                "minimum": 1
              }
            }
          },
          "setup": {
            "type": "array",
            "maxItems": 20,
            "items": {
              "$ref": "#/$defs/action"
            }
          },
          "steps": {
            "type": "array",
            "minItems": 1,
            "maxItems": 8,
            "items": {
              "$ref": "#/$defs/step"
            }
          }
        },
        "$defs": {
          "step": {
            "type": "object",
            "required": [
              "step",
              "title",
              "expected",
              "actions"
            ],
            "additionalProperties": false,
            "properties": {
              "step": {
                "type": "integer",
                "minimum": 1,
                "maximum": 8
              },
              "title": {
                "type": "string",
                "minLength": 1,
                "maxLength": 500,
                "pattern": "^[^\\n]+$"
              },
              "expected": {
                "type": "string",
                "minLength": 1,
                "maxLength": 500,
                "pattern": "^[^\\n]+$"
              },
              "actions": {
                "type": "array",
                "minItems": 1,
                "maxItems": 10,
                "items": {
                  "$ref": "#/$defs/action"
                }
              }
            }
          },
          "action": {
            "oneOf": [
              {
                "$ref": "#/$defs/open"
              },
              {
                "$ref": "#/$defs/click"
              },
              {
                "$ref": "#/$defs/type"
              },
              {
                "$ref": "#/$defs/press"
              },
              {
                "$ref": "#/$defs/wait"
              }
            ]
          },
          "open": {
            "required": [
              "do",
              "url"
            ],
            "properties": {
              "do": {
                "const": "open"
              },
              "url": {
                "type": "string",
                "minLength": 1,
                "maxLength": 2048,
                "pattern": "^\\S+$"
              }
            },
            "type": "object",
            "additionalProperties": false
          },
          "click": {
            "required": [
              "do",
              "target"
            ],
            "properties": {
              "do": {
                "const": "click"
              },
              "target": {
                "$ref": "#/$defs/target"
              }
            },
            "type": "object",
            "additionalProperties": false
          },
          "type": {
            "required": [
              "do",
              "target"
            ],
            "properties": {
              "do": {
                "const": "type"
              },
              "target": {
                "$ref": "#/$defs/target"
              },
              "text": {
                "type": "string",
                "maxLength": 2000
              },
              "variable": {
                "type": "string",
                "pattern": "^[A-Z][A-Z0-9_]{0,63}$"
              }
            },
            "oneOf": [
              {
                "required": [
                  "text"
                ]
              },
              {
                "required": [
                  "variable"
                ]
              }
            ],
            "type": "object",
            "additionalProperties": false
          },
          "press": {
            "required": [
              "do",
              "key"
            ],
            "properties": {
              "do": {
                "const": "press"
              },
              "key": {
                "type": "string",
                "pattern": "^[A-Za-z0-9+]{1,40}$"
              }
            },
            "type": "object",
            "additionalProperties": false
          },
          "wait": {
            "required": [
              "do",
              "text"
            ],
            "properties": {
              "do": {
                "const": "wait"
              },
              "text": {
                "type": "string",
                "minLength": 1,
                "maxLength": 500
              },
              "timeout_ms": {
                "type": "integer",
                "minimum": 1,
                "maximum": 60000
              }
            },
            "type": "object",
            "additionalProperties": false
          },
          "target": {
            "type": "string",
            "minLength": 1,
            "maxLength": 500
          }
        }
      }
  - name: demo-evidence
    base_view: structured
    size_limit: 1048576
    max_files: 1
    # The same JSON Schema is in running-a-software-workflow/schemas/demo-evidence.schema.json.
    json_schema:
      {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "title": "Demo evidence, version 1",
        "description": "One demo scenario's verdict on one commit.",
        "type": "object",
        "required": [
          "scenario",
          "title",
          "commit",
          "planned",
          "evidence",
          "verdict",
          "script",
          "steps"
        ],
        "additionalProperties": false,
        "properties": {
          "scenario": {
            "type": "string",
            "pattern": "^scenario-[1-9][0-9]?$"
          },
          "title": {
            "type": "string",
            "minLength": 1,
            "maxLength": 500,
            "pattern": "^[^\\n]+$"
          },
          "commit": {
            "$ref": "#/$defs/commit"
          },
          "planned": {
            "enum": [
              "film",
              "pictures"
            ]
          },
          "evidence": {
            "enum": [
              "film",
              "pictures",
              "none"
            ]
          },
          "verdict": {
            "enum": [
              "passed",
              "failed"
            ]
          },
          "class": {
            "enum": [
              "product",
              "script",
              "setup"
            ]
          },
          "retries": {
            "type": "integer",
            "minimum": 0,
            "maximum": 1
          },
          "script": {
            "$ref": "#/$defs/version"
          },
          "media": {
            "$ref": "#/$defs/version"
          },
          "steps": {
            "type": "array",
            "minItems": 1,
            "maxItems": 8,
            "items": {
              "$ref": "#/$defs/step"
            }
          }
        },
        "allOf": [
          {
            "if": {
              "properties": {
                "verdict": {
                  "const": "failed"
                }
              }
            },
            "then": {
              "required": [
                "class"
              ]
            }
          },
          {
            "if": {
              "properties": {
                "evidence": {
                  "enum": [
                    "film",
                    "pictures"
                  ]
                }
              }
            },
            "then": {
              "required": [
                "media"
              ]
            }
          }
        ],
        "$defs": {
          "step": {
            "type": "object",
            "required": [
              "step",
              "title",
              "expected",
              "verdict",
              "frames"
            ],
            "additionalProperties": false,
            "properties": {
              "step": {
                "type": "integer",
                "minimum": 1,
                "maximum": 8
              },
              "title": {
                "type": "string",
                "minLength": 1,
                "maxLength": 500,
                "pattern": "^[^\\n]+$"
              },
              "expected": {
                "type": "string",
                "minLength": 1,
                "maxLength": 500,
                "pattern": "^[^\\n]+$"
              },
              "verdict": {
                "enum": [
                  "passed",
                  "failed",
                  "not-reached"
                ]
              },
              "frames": {
                "type": "array",
                "maxItems": 2,
                "items": {
                  "$ref": "#/$defs/frame"
                }
              },
              "finding": {
                "type": "string",
                "maxLength": 2000
              }
            }
          },
          "frame": {
            "type": "object",
            "required": [
              "at"
            ],
            "additionalProperties": false,
            "properties": {
              "at": {
                "enum": [
                  "start",
                  "reached"
                ]
              },
              "time_ms": {
                "type": "integer",
                "minimum": 0
              },
              "file": {
                "type": "string",
                "pattern": "^scenario-[1-9][0-9]?-step-[1-8]\\.png$"
              }
            }
          },
          "version": {
            "type": "object",
            "required": [
              "type",
              "name",
              "version"
            ],
            "additionalProperties": false,
            "properties": {
              "type": {
                "$ref": "#/$defs/name"
              },
              "name": {
