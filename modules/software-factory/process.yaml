apiVersion: qory.dev/v1alpha1
name: Software factory
summary: Agents change code in your repositories. Each ticket needs a repository.
description: |-
  Each ticket comes from a work source, such as an issue tracker. Agents take the ticket through the stages, and at the end of each stage a member approves the result before the next stage starts. Changes go to your repositories through the destination you connect.

  You connect: where work comes from, where changes go, and a model.
type: qory.software
stack: software
process:
  schema: qory.process/v1
  machine: default
  stages:
    - id: st_r79kph11eg
      name: Explore
      description: >-
        Agents read the ticket, its comments and the target, and write questions
        for members about what the ticket leaves open. The stage ends with a proposal: the
        general direction for solving the ticket.
      inputs: []
      sequence:
        - workflow: explore-a-ticket
      outputs:
        - type: proposal
          required: true
      gate: {kind: person, approvers: members}
    - id: st_p9w5cvh311
      name: Shape
      description: >-
        Agents turn the ticket and the proposal into a spec of the rules that change, and
        into acceptance criteria: at most seven statements of when the work is done. Where
        the change needs them, agents record technical decisions, draw mockups of changed
        screens, and write demo scenarios for what a person sees. The stage ends with a spec
        and acceptance criteria, plus any of those.
      inputs:
        - type: proposal
          required: false
      sequence:
        - workflow: shape-a-ticket
      outputs:
        - type: spec
          required: true
        - type: acceptance-criteria
          required: true
        - type: decision-record
          required: false
        - type: mockup
          required: false
        - type: demo-scenarios
          required: false
      gate: {kind: person, approvers: members}
    - id: st_6ns22c4pav
      name: Build
      description: >-
        Agents change the code in the target's repositories so that it meets the
        spec. The stage ends with the change committed on one branch in each repository.
      inputs: []
      sequence: []
      outputs: []
      gate: {kind: person, approvers: members}
    - id: st_m1mqbeywdg
      name: Verify
      description: >-
        Agents test the change against the acceptance criteria. The stage
        ends with the test results and the evidence, such as screenshots and a demo video.
      inputs: []
      sequence: []
      outputs: []
      gate: {kind: person, approvers: members}
    - id: st_k9kpv17xmy
      name: Release
      description: >-
        Agents send the change through the destination you connect, for example
        as a pull request in each repository. The stage ends when the destination has the
        change for each repository.
      inputs: []
      sequence: []
      outputs: []
      gate: {kind: person, approvers: members}
artifact_types:
  - name: acceptance-criteria
    base_view: structured
    size_limit: 65536
    max_files: 1
    # The same JSON Schema is in
    # running-a-software-workflow/schemas/acceptance-criteria.schema.json.
    json_schema:
      {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "$id": "https://qory.dev/contracts/harness/v1/acceptance-criteria.schema.json",
        "title": "The acceptance criteria format, version 1",
        "description": "The acceptance criteria of a work item: a summary of what the work item must achieve, and the criteria that say when it is achieved, each with the check that shows it. A criterion that is dropped stays in the list, with removed and its reason. The file of a version of a structured artifact type. Each criterion's id is unique in the document, which a JSON Schema cannot check. The file's size limit is the artifact type's, which a JSON Schema cannot check either. No object has a member this schema does not define.",
        "type": "object",
        "required": [
          "summary",
          "criteria"
        ],
        "additionalProperties": false,
        "properties": {
          "summary": {
            "description": "What the work item must achieve, in plain text.",
            "$ref": "#/$defs/short_text"
          },
          "criteria": {
            "description": "Every criterion, in the order they were written, at least one. A removed criterion stays in the list.",
            "type": "array",
            "minItems": 1,
            "items": {
              "$ref": "#/$defs/criterion"
            }
          }
        },
        "$defs": {
          "criterion": {
            "description": "One criterion: a condition that the finished work item meets, and how to check that it does. removed is present exactly when the criterion is dropped.",
            "type": "object",
            "required": [
              "id",
              "text",
              "check"
            ],
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "The criterion's id, unique in the document: ac- and a number from 1 to 9999 with no leading zero, such as ac-3.",
                "$ref": "#/$defs/criterion_id"
              },
              "text": {
                "description": "The condition that the finished work item meets, in plain text.",
                "$ref": "#/$defs/short_text"
              },
              "check": {
                "description": "How to check that the condition is met, as free text: what to look at, run or ask, and what result counts as met.",
                "$ref": "#/$defs/short_text"
              },
              "removed": {
                "description": "Present when the criterion is dropped from the work item: the reason. The criterion keeps its id and its text.",
                "$ref": "#/$defs/removed"
              }
            }
          },
          "removed": {
            "description": "The mark of a dropped criterion.",
            "type": "object",
            "required": [
              "reason"
            ],
            "additionalProperties": false,
            "properties": {
              "reason": {
                "description": "Why the criterion is dropped, in plain text.",
                "$ref": "#/$defs/short_text"
              }
            }
          },
          "criterion_id": {
            "description": "A criterion's id: ac- and a number from 1 to 9999 with no leading zero, such as ac-3.",
            "type": "string",
            "pattern": "^ac-[1-9][0-9]{0,3}$"
          },
          "text": {
            "description": "Text that may span lines. Tab, line feed and carriage return are its only control characters: it has none of U+0000 to U+0008, U+000B, U+000C, U+000E to U+001F, U+007F and U+0080 to U+009F. It has none of the bidirectional controls, the marks U+061C, U+200E and U+200F, the embeddings and overrides U+202A to U+202E and the isolates U+2066 to U+2069; the separators U+2028 and U+2029; and the format characters U+00AD, U+180E, U+200B, U+2060 to U+2064, U+FEFF and U+FFF9 to U+FFFB.",
            "type": "string",
            "pattern": "^[^\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f\u0080-\u009f\u00ad\u061c\u180e\u200b\u200e\u200f\u2028\u2029\u202a-\u202e\u2060-\u2064\u2066-\u2069\ufeff\ufff9-\ufffb]*$"
          },
          "line": {
            "description": "Text on one line: text as $defs text defines it, with no control character at all, so no tab, line feed or carriage return.",
            "type": "string",
            "pattern": "^[^\u0000-\u001f\u007f\u0080-\u009f\u00ad\u061c\u180e\u200b\u200e\u200f\u2028\u2029\u202a-\u202e\u2060-\u2064\u2066-\u2069\ufeff\ufff9-\ufffb]*$"
          },
          "short_text": {
            "description": "A short text, 1 to 2000 characters.",
            "$ref": "#/$defs/text",
            "minLength": 1,
            "maxLength": 2000
          }
        }
      }
  - name: mockup
  - name: screenshot
  - name: demo-video
  - name: explainer
  - name: decision-record
  - name: spec
    base_view: document
    size_limit: 1048576
    max_files: 1
  - name: demo-scenarios
    base_view: document
    size_limit: 1048576
    max_files: 1
  - name: submission
    base_view: structured
    size_limit: 1048576
    max_files: 1
    # The same JSON Schema is in running-a-software-workflow/schemas/submission.schema.json.
    json_schema:
      {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "title": "Submission, version 1",
        "description": "A session's branch, commits, draft, text and verdict.",
        "type": "object",
        "required": [
          "ref",
          "repositories",
          "verdict"
        ],
        "additionalProperties": false,
        "properties": {
          "ref": {
            "title": "Branch",
            "type": "string",
            "pattern": "^qory/wi_[A-Za-z0-9_-]{1,64}$"
          },
          "verdict": {
            "enum": [
              "passed",
              "changes-requested",
              "escalate",
              "none"
            ]
          },
          "repositories": {
            "type": "array",
            "minItems": 1,
            "maxItems": 20,
            "items": {
              "$ref": "#/$defs/repository"
            }
          },
          "text": {
            "$ref": "#/$defs/text"
          }
        },
        "$defs": {
          "repository": {
            "type": "object",
            "required": [
              "system",
              "path",
              "commit",
              "draft"
            ],
            "additionalProperties": false,
            "properties": {
              "system": {
                "type": "string",
                "pattern": "^[a-z0-9.-]{0,252}[a-z0-9-]$"
              },
              "path": {
                "type": "string",
                "maxLength": 200,
                "pattern": "^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$",
                "not": {
                  "pattern": "(^|/)(\\.\\.?|\\.[Gg][Ii][Tt])(/|$)"
                }
              },
              "commit": {
                "title": "Commit",
                "$ref": "#/$defs/commit"
              },
              "commit_url": {
                "title": "Commit link",
                "type": "string",
                "maxLength": 2048,
                "pattern": "^https://\\S+$"
              },
              "draft": {
                "oneOf": [
                  {
                    "$ref": "#/$defs/draft"
                  },
                  {
                    "$ref": "#/$defs/no_draft"
                  }
                ]
              }
            }
          },
          "draft": {
            "type": "object",
            "required": [
              "number",
              "url",
              "title",
              "state",
              "action"
            ],
            "additionalProperties": false,
            "properties": {
              "number": {
                "title": "Draft",
                "type": "integer",
                "minimum": 1
              },
              "url": {
                "title": "Draft link",
                "type": "string",
                "maxLength": 2048,
                "pattern": "^https://\\S+$"
              },
              "title": {
                "title": "Draft title",
                "type": "string",
                "minLength": 1,
                "maxLength": 256,
                "pattern": "^[^\\x00-\\x1f\\x7f]+$"
              },
              "state": {
                "enum": [
                  "draft",
                  "open"
                ]
              },
              "action": {
                "enum": [
                  "opened",
                  "updated",
                  "kept"
                ]
              }
            }
          },
          "no_draft": {
            "type": "object",
            "required": [
              "none"
            ],
            "additionalProperties": false,
            "properties": {
              "none": {
                "title": "No draft",
                "enum": [
                  "not-passed",
                  "no-text",
                  "escalated",
                  "no-program"
                ]
              }
            }
          },
          "text": {
            "type": "object",
            "required": [
              "title",
              "description"
            ],
            "additionalProperties": false,
            "properties": {
              "title": {
                "type": "string",
                "minLength": 1,
                "maxLength": 256,
                "pattern": "^[^\\n]+$"
              },
              "description": {
                "type": "string",
                "minLength": 1,
                "maxLength": 16384
              }
            }
          },
          "commit": {
            "type": "string",
            "pattern": "^([0-9a-f]{40}|[0-9a-f]{64})$"
          }
        }
      }
  - name: build-plan
    base_view: document
    size_limit: 1048576
    max_files: 1
  - name: build-report
    base_view: document
    size_limit: 1048576
    max_files: 1
  - name: build-ledger
    base_view: structured
    size_limit: 1048576
    max_files: 1
    withdrawable: false
    # The same JSON Schema is in running-a-software-workflow/schemas/build-ledger.schema.json.
    json_schema:
      {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "title": "Build ledger, version 1",
        "description": "Build's steps with their input hashes, and escalations.",
        "type": "object",
        "required": [
          "steps",
          "escalations"
        ],
        "additionalProperties": false,
        "properties": {
          "steps": {
            "type": "array",
            "maxItems": 100,
            "items": {
              "$ref": "#/$defs/step"
            }
          },
          "escalations": {
            "type": "array",
            "maxItems": 20,
            "items": {
              "$ref": "#/$defs/escalation"
            }
          }
        },
        "$defs": {
          "step": {
            "type": "object",
            "required": [
              "id",
              "pass",
              "kind",
              "workflow",
              "inputs",
              "state",
              "base",
              "attempts",
              "replays",
              "started_at"
            ],
            "additionalProperties": false,
            "properties": {
              "id": {
                "type": "string",
                "maxLength": 64,
                "pattern": "^(plan|checks|small-change|deliverable:d-[1-9][0-9]{0,2}|fix:[a-z0-9-]{1,40}|script:scenario-[1-9][0-9]?(#[23])?)$"
              },
              "pass": {
                "type": "integer",
                "minimum": 1,
                "maximum": 100
              },
              "kind": {
                "enum": [
                  "plan",
                  "checks",
                  "deliverable",
                  "fix",
                  "script",
                  "small-change"
                ]
              },
              "workflow": {
                "$ref": "#/$defs/workflow"
              },
              "inputs": {
                "$ref": "#/$defs/sha256"
              },
              "state": {
                "enum": [
                  "running",
                  "done",
                  "failed"
                ]
              },
              "base": {
                "$ref": "#/$defs/commit"
              },
              "commit": {
                "$ref": "#/$defs/commit"
              },
              "script_sha256": {
                "$ref": "#/$defs/sha256"
              },
              "attempts": {
                "type": "array",
                "maxItems": 3,
                "items": {
                  "$ref": "#/$defs/attempt"
                }
              },
              "pushed": {
                "type": "array",
                "maxItems": 4,
                "items": {
                  "$ref": "#/$defs/version"
                }
              },
              "report": {
                "type": "string",
                "maxLength": 8192
              },
              "replays": {
                "type": "integer",
                "minimum": 0,
                "maximum": 100
              },
              "started_at": {
                "$ref": "#/$defs/time"
              },
              "ended_at": {
                "$ref": "#/$defs/time"
              }
            },
            "allOf": [
              {
                "if": {
                  "properties": {
                    "state": {
                      "const": "done"
                    }
                  }
                },
                "then": {
                  "required": [
                    "commit",
                    "ended_at"
                  ]
                }
              },
              {
                "if": {
                  "properties": {
                    "kind": {
                      "const": "script"
                    },
                    "state": {
                      "const": "done"
                    }
                  }
                },
                "then": {
                  "required": [
                    "script_sha256"
                  ]
                }
              }
            ]
          },
          "attempt": {
            "type": "object",
            "required": [
              "agent",
              "role",
              "tier",
              "model"
            ],
            "additionalProperties": false,
            "properties": {
              "agent": {
                "$ref": "#/$defs/name"
              },
              "role": {
                "$ref": "#/$defs/name"
              },
              "tier": {
                "enum": [
                  "light",
                  "balanced",
                  "thinking"
                ]
              },
              "model": {
                "type": "string",
                "minLength": 1,
                "maxLength": 100,
                "pattern": "^[!-~]+$"
              }
            }
          },
          "escalation": {
            "type": "object",
            "required": [
              "workflow",
              "reason",
              "at"
            ],
            "additionalProperties": false,
            "properties": {
              "workflow": {
                "$ref": "#/$defs/workflow"
              },
              "reason": {
                "enum": [
                  "short-path",
                  "plan-limit",
                  "ledger-full",
                  "check-judged-wrong",
                  "findings-open",
                  "preflight",
                  "no-agent",
                  "other"
                ]
              },
              "detail": {
                "type": "string",
                "maxLength": 1000
              },
              "at": {
                "$ref": "#/$defs/time"
              }
            }
          },
          "version": {
            "type": "object",
            "required": [
              "type",
              "name",
              "version"
            ],
            "additionalProperties": false,
            "properties": {
              "type": {
                "$ref": "#/$defs/name"
              },
              "name": {
                "$ref": "#/$defs/name"
              },
              "version": {
                "type": "integer",
                "minimum": 1,
                "maximum": 999999
              }
            }
          },
          "name": {
            "type": "string",
            "pattern": "^[a-z0-9]+(-[a-z0-9]+)*$",
            "maxLength": 32
          },
          "workflow": {
            "type": "string",
            "pattern": "^[a-z][a-z0-9-]{0,54}$"
          },
          "commit": {
            "type": "string",
            "pattern": "^([0-9a-f]{40}|[0-9a-f]{64})$"
          },
          "sha256": {
            "type": "string",
            "pattern": "^[0-9a-f]{64}$"
          },
          "time": {
            "type": "string",
            "format": "date-time",
            "maxLength": 40,
            "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}[Tt][0-9:.]+([Zz]|[+-][0-9]{2}:[0-9]{2})$"
          }
        }
      }
  - name: acceptance-lock
    base_view: structured
    size_limit: 1048576
    max_files: 1
    withdrawable: false
    # The same JSON Schema is in running-a-software-workflow/schemas/acceptance-lock.schema.json.
    json_schema:
      {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "title": "Acceptance lock, version 1",
        "description": "The hashes of the locked acceptance checks.",
        "type": "object",
        "required": [
          "criteria",
          "start_commit",
          "commit",
          "checks"
        ],
        "additionalProperties": false,
        "properties": {
          "criteria": {
            "type": "object",
            "required": [
              "version"
            ],
            "additionalProperties": false,
            "properties": {
              "version": {
                "type": "integer",
                "minimum": 1
              },
              "decision": {
                "type": "string",
                "minLength": 1,
                "maxLength": 64,
                "pattern": "^[A-Za-z0-9_-]+$"
              }
            }
          },
          "start_commit": {
            "$ref": "#/$defs/commit"
          },
          "commit": {
            "$ref": "#/$defs/commit"
          },
          "checks": {
            "type": "array",
            "minItems": 1,
            "maxItems": 50,
            "items": {
              "$ref": "#/$defs/check"
            }
          },
          "support": {
            "type": "array",
            "maxItems": 50,
            "items": {
              "$ref": "#/$defs/file"
            }
          }
        },
        "$defs": {
          "check": {
            "type": "object",
            "required": [
              "criterion",
              "path",
              "sha256",
              "command",
              "failed_with"
            ],
            "additionalProperties": false,
            "properties": {
              "criterion": {
                "type": "string",
                "pattern": "^ac-[1-9][0-9]{0,3}$"
              },
              "repository": {
                "type": "string",
                "maxLength": 200,
                "pattern": "^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$",
                "not": {
                  "pattern": "(^|/)\\.\\.?(/|$)"
                }
              },
              "path": {
                "$ref": "#/$defs/path"
              },
              "sha256": {
                "$ref": "#/$defs/sha256"
              },
              "command": {
                "type": "string",
                "minLength": 1,
                "maxLength": 1000
              },
              "failed_with": {
                "type": "integer",
                "minimum": 1,
                "maximum": 255
              }
            }
          },
          "file": {
            "type": "object",
            "required": [
              "path",
              "sha256"
            ],
            "additionalProperties": false,
            "properties": {
              "repository": {
                "type": "string",
                "maxLength": 200,
                "pattern": "^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$",
                "not": {
                  "pattern": "(^|/)\\.\\.?(/|$)"
                }
              },
              "path": {
                "$ref": "#/$defs/path"
              },
              "sha256": {
                "$ref": "#/$defs/sha256"
              }
            }
          },
          "path": {
            "type": "string",
            "maxLength": 1000,
            "pattern": "^[^/\\s][^\\s]*$",
            "not": {
              "pattern": "(^|/)\\.\\.?(/|$)"
            }
          },
          "commit": {
            "type": "string",
            "pattern": "^([0-9a-f]{40}|[0-9a-f]{64})$"
          },
          "sha256": {
            "type": "string",
            "pattern": "^[0-9a-f]{64}$"
          }
        }
      }
  - name: demo-script
    base_view: structured
    size_limit: 1048576
    max_files: 1
    # The same JSON Schema is in running-a-software-workflow/schemas/demo-script.schema.json.
    json_schema:
      {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "title": "Demo script, version 1",
        "description": "The browser actions of one approved demo scenario.",
        "type": "object",
        "required": [
          "scenario",
          "title",
          "evidence",
          "source",
          "setup",
          "steps"
        ],
        "additionalProperties": false,
        "properties": {
          "scenario": {
            "type": "string",
            "pattern": "^scenario-[1-9][0-9]?$"
          },
          "title": {
            "type": "string",
            "minLength": 1,
            "maxLength": 500,
            "pattern": "^[^\\n]+$"
          },
          "evidence": {
            "enum": [
              "film",
              "pictures"
            ]
          },
          "source": {
            "type": "object",
            "required": [
              "version"
            ],
            "additionalProperties": false,
            "properties": {
              "version": {
                "type": "integer",
                "minimum": 1
              }
            }
          },
          "setup": {
            "type": "array",
            "maxItems": 20,
            "items": {
              "$ref": "#/$defs/action"
            }
          },
          "steps": {
            "type": "array",
            "minItems": 1,
            "maxItems": 8,
            "items": {
              "$ref": "#/$defs/step"
            }
          }
        },
        "$defs": {
          "step": {
            "type": "object",
            "required": [
              "step",
              "title",
              "expected",
              "actions"
            ],
            "additionalProperties": false,
            "properties": {
              "step": {
                "type": "integer",
                "minimum": 1,
                "maximum": 8
              },
              "title": {
                "type": "string",
                "minLength": 1,
                "maxLength": 500,
                "pattern": "^[^\\n]+$"
              },
              "expected": {
                "type": "string",
                "minLength": 1,
                "maxLength": 500,
                "pattern": "^[^\\n]+$"
              },
              "actions": {
                "type": "array",
                "minItems": 1,
                "maxItems": 10,
                "items": {
                  "$ref": "#/$defs/action"
                }
              }
            }
          },
          "action": {
            "oneOf": [
              {
                "$ref": "#/$defs/open"
              },
              {
                "$ref": "#/$defs/click"
              },
              {
                "$ref": "#/$defs/type"
              },
              {
                "$ref": "#/$defs/press"
              },
              {
                "$ref": "#/$defs/wait"
              }
            ]
          },
          "open": {
            "required": [
              "do",
              "url"
            ],
            "properties": {
              "do": {
                "const": "open"
              },
              "url": {
                "type": "string",
                "minLength": 1,
                "maxLength": 2048,
                "pattern": "^\\S+$"
              }
            },
            "type": "object",
            "additionalProperties": false
          },
          "click": {
            "required": [
              "do",
              "target"
            ],
            "properties": {
              "do": {
                "const": "click"
              },
              "target": {
                "$ref": "#/$defs/target"
              }
            },
            "type": "object",
            "additionalProperties": false
          },
          "type": {
            "required": [
              "do",
              "target"
            ],
            "properties": {
              "do": {
                "const": "type"
              },
              "target": {
                "$ref": "#/$defs/target"
              },
              "text": {
                "type": "string",
                "maxLength": 2000
              },
              "variable": {
                "type": "string",
                "pattern": "^[A-Z][A-Z0-9_]{0,63}$"
              }
            },
            "oneOf": [
              {
                "required": [
                  "text"
                ]
              },
              {
                "required": [
                  "variable"
                ]
              }
            ],
            "type": "object",
            "additionalProperties": false
          },
          "press": {
            "required": [
              "do",
              "key"
            ],
            "properties": {
              "do": {
                "const": "press"
              },
              "key": {
                "type": "string",
                "pattern": "^[A-Za-z0-9+]{1,40}$"
              }
            },
            "type": "object",
            "additionalProperties": false
          },
          "wait": {
            "required": [
              "do",
              "text"
            ],
            "properties": {
              "do": {
                "const": "wait"
              },
              "text": {
                "type": "string",
                "minLength": 1,
                "maxLength": 500
              },
              "timeout_ms": {
                "type": "integer",
                "minimum": 1,
                "maximum": 60000
              }
            },
            "type": "object",
            "additionalProperties": false
          },
          "target": {
            "type": "string",
            "minLength": 1,
            "maxLength": 500
          }
        }
      }
  - name: demo-evidence
    base_view: structured
    size_limit: 1048576
    max_files: 1
    # The same JSON Schema is in running-a-software-workflow/schemas/demo-evidence.schema.json.
    json_schema:
      {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "title": "Demo evidence, version 1",
        "description": "One demo scenario's verdict on one commit.",
        "type": "object",
        "required": [
          "scenario",
          "title",
          "commit",
          "planned",
          "evidence",
          "verdict",
          "script",
          "steps"
        ],
        "additionalProperties": false,
        "properties": {
          "scenario": {
            "type": "string",
            "pattern": "^scenario-[1-9][0-9]?$"
          },
          "title": {
            "type": "string",
            "minLength": 1,
            "maxLength": 500,
            "pattern": "^[^\\n]+$"
          },
          "commit": {
            "$ref": "#/$defs/commit"
          },
          "planned": {
            "enum": [
              "film",
              "pictures"
            ]
          },
          "evidence": {
            "enum": [
              "film",
              "pictures",
              "none"
            ]
          },
          "verdict": {
            "enum": [
              "passed",
              "failed"
            ]
          },
          "class": {
            "enum": [
              "product",
              "script",
              "setup"
            ]
          },
          "retries": {
            "type": "integer",
            "minimum": 0,
            "maximum": 1
          },
          "script": {
            "$ref": "#/$defs/version"
          },
          "media": {
            "$ref": "#/$defs/version"
          },
          "steps": {
            "type": "array",
            "minItems": 1,
            "maxItems": 8,
            "items": {
              "$ref": "#/$defs/step"
            }
          }
        },
        "allOf": [
          {
            "if": {
              "properties": {
                "verdict": {
                  "const": "failed"
                }
              }
            },
            "then": {
              "required": [
                "class"
              ]
            }
          },
          {
            "if": {
              "properties": {
                "evidence": {
                  "enum": [
                    "film",
                    "pictures"
                  ]
                }
              }
            },
            "then": {
              "required": [
                "media"
              ]
            }
          }
        ],
        "$defs": {
          "step": {
            "type": "object",
            "required": [
              "step",
              "title",
              "expected",
              "verdict",
              "frames"
            ],
            "additionalProperties": false,
            "properties": {
              "step": {
                "type": "integer",
                "minimum": 1,
                "maximum": 8
              },
              "title": {
                "type": "string",
                "minLength": 1,
                "maxLength": 500,
                "pattern": "^[^\\n]+$"
              },
              "expected": {
                "type": "string",
                "minLength": 1,
                "maxLength": 500,
                "pattern": "^[^\\n]+$"
              },
              "verdict": {
                "enum": [
                  "passed",
                  "failed",
                  "not-reached"
                ]
              },
              "frames": {
                "type": "array",
                "maxItems": 2,
                "items": {
                  "$ref": "#/$defs/frame"
                }
              },
              "finding": {
                "type": "string",
                "maxLength": 2000
              }
            }
          },
          "frame": {
            "type": "object",
            "required": [
              "at"
            ],
            "additionalProperties": false,
            "properties": {
              "at": {
                "enum": [
                  "start",
                  "reached"
                ]
              },
              "time_ms": {
                "type": "integer",
                "minimum": 0
              },
              "file": {
                "type": "string",
                "pattern": "^scenario-[1-9][0-9]?-step-[1-8]\\.png$"
              }
            }
          },
          "version": {
            "type": "object",
            "required": [
              "type",
              "name",
              "version"
            ],
            "additionalProperties": false,
            "properties": {
              "type": {
                "$ref": "#/$defs/name"
              },
              "name": {
                "$ref": "#/$defs/name"
              },
              "version": {
                "type": "integer",
                "minimum": 1,
                "maximum": 999999
              }
            }
          },
          "name": {
            "type": "string",
            "pattern": "^[a-z0-9]+(-[a-z0-9]+)*$",
            "maxLength": 64
          },
          "commit": {
            "type": "string",
            "pattern": "^([0-9a-f]{40}|[0-9a-f]{64})$"
          }
        }
      }
  - name: verification
    base_view: structured
    size_limit: 65536
    max_files: 1
    # The same JSON Schema is in running-a-software-workflow/schemas/verification.schema.json.
    json_schema:
      {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "$id": "https://qory.dev/contracts/harness/v1/verification.schema.json",
        "title": "The verification format, version 1",
        "description": "The result of checking a work item's acceptance criteria against one version of its work: the file of a version of a structured artifact type. matrix has one row for each criterion that was checked, and not_verified lists each criterion that was not, with the reason. A criterion is in matrix or in not_verified, never in both, which a JSON Schema cannot check. The ids are the criterion ids of acceptance-criteria.schema.json, and each is one of the ids in the newest version of the acceptance criteria, which a JSON Schema cannot check either. The file's size limit is the artifact type's, which a JSON Schema cannot check. No object has a member this schema does not define.",
        "type": "object",
        "required": [
          "target_version",
          "matrix",
          "not_verified",
          "model_families"
        ],
        "additionalProperties": false,
        "properties": {
          "target_version": {
            "description": "The exact version of the target that the verification checked, never a name that can later point to another version. For a repository, a commit. The grammar is generic, because a target in another system has another kind of version: 1 to 255 letters, digits and the characters ._/-.",
            "type": "string",
            "pattern": "^[A-Za-z0-9._/-]{1,255}$"
          },
          "matrix": {
            "description": "One row for each criterion that was checked, in the order of the criteria: empty when no criterion was checked.",
            "type": "array",
            "items": {
              "$ref": "#/$defs/row"
            }
          },
          "not_verified": {
            "description": "Each criterion that was not checked, with the reason: empty when every criterion was checked.",
            "type": "array",
            "items": {
              "$ref": "#/$defs/not_verified"
            }
          },
          "model_families": {
            "description": "The families of the models that checked the criteria, such as the names of their makers: at least one, each 1 to 64 characters on one line, none twice.",
            "type": "array",
            "minItems": 1,
            "uniqueItems": true,
            "items": {
              "$ref": "#/$defs/line",
              "minLength": 1,
              "maxLength": 64
            }
          }
        },
        "$defs": {
          "row": {
            "description": "The result for one criterion that was checked.",
            "type": "object",
            "required": [
              "criterion",
              "state",
              "evidence"
            ],
            "additionalProperties": false,
            "properties": {
              "criterion": {
                "description": "The id of the criterion: ac- and a number from 1 to 9999 with no leading zero, such as ac-3.",
                "$ref": "#/$defs/criterion_id"
              },
              "state": {
                "description": "met when the check shows that the criterion is met, not_met when the check shows that it is not.",
                "enum": [
                  "met",
                  "not_met"
                ]
              },
              "evidence": {
                "description": "What the check found, in plain text: what was looked at or run, and the result.",
                "$ref": "#/$defs/short_text"
              }
            }
          },
          "not_verified": {
            "description": "A criterion that was not checked, and why.",
            "type": "object",
            "required": [
              "criterion",
              "reason"
            ],
            "additionalProperties": false,
            "properties": {
              "criterion": {
                "description": "The id of the criterion: ac- and a number from 1 to 9999 with no leading zero, such as ac-3.",
                "$ref": "#/$defs/criterion_id"
              },
              "reason": {
                "description": "Why the criterion was not checked, in plain text.",
                "$ref": "#/$defs/short_text"
              }
            }
          },
          "criterion_id": {
            "description": "A criterion's id: ac- and a number from 1 to 9999 with no leading zero, such as ac-3.",
            "type": "string",
            "pattern": "^ac-[1-9][0-9]{0,3}$"
          },
          "text": {
            "description": "Text that may span lines. Tab, line feed and carriage return are its only control characters: it has none of U+0000 to U+0008, U+000B, U+000C, U+000E to U+001F, U+007F and U+0080 to U+009F. It has none of the bidirectional controls, the marks U+061C, U+200E and U+200F, the embeddings and overrides U+202A to U+202E and the isolates U+2066 to U+2069; the separators U+2028 and U+2029; and the format characters U+00AD, U+180E, U+200B, U+2060 to U+2064, U+FEFF and U+FFF9 to U+FFFB.",
            "type": "string",
            "pattern": "^[^\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f\u0080-\u009f\u00ad\u061c\u180e\u200b\u200e\u200f\u2028\u2029\u202a-\u202e\u2060-\u2064\u2066-\u2069\ufeff\ufff9-\ufffb]*$"
          },
          "line": {
            "description": "Text on one line: text as $defs text defines it, with no control character at all, so no tab, line feed or carriage return.",
            "type": "string",
            "pattern": "^[^\u0000-\u001f\u007f\u0080-\u009f\u00ad\u061c\u180e\u200b\u200e\u200f\u2028\u2029\u202a-\u202e\u2060-\u2064\u2066-\u2069\ufeff\ufff9-\ufffb]*$"
          },
          "short_text": {
            "description": "A short text, 1 to 2000 characters.",
            "$ref": "#/$defs/text",
            "minLength": 1,
            "maxLength": 2000
          }
        }
      }
