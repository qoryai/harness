apiVersion: qory.dev/v1alpha1
name: Software factory
summary: Agents change code in your repositories. Each ticket needs a repository.
description: |-
  Each ticket comes from a work source, such as an issue tracker. Agents take the ticket through the stages, and at the end of each stage a member approves the result before the next stage starts. Changes go to your repositories through the destination you connect.

  You connect: where work comes from, where changes go, and a model.
type: qory.software
stack: software
process:
  schema: qory.process/v1
  machine: default
  stages:
    - id: st_r79kph11eg
      name: Explore
      description: >-
        Agents read the ticket, its comments and the target, and write questions
        for members about what the ticket leaves open. The stage ends with a proposal: the
        general direction for solving the ticket.
      inputs: []
      sequence:
        - workflow: explore-a-ticket
      outputs:
        - type: proposal
          required: true
      gate: {kind: person, approvers: members}
    - id: st_p9w5cvh311
      name: Shape
      description: >-
        Agents turn the ticket and the proposal into a spec, the rules that change,
        and acceptance criteria, at most seven statements of when the work is done. Where
        the change needs them, agents record technical decisions, draw mockups of changed
        screens, and write demo scenarios for what a person sees. The stage ends with a spec
        and acceptance criteria, plus any of those.
      inputs:
        - type: proposal
          required: false
      sequence:
        - workflow: shape-a-ticket
          image: browser
      outputs:
        - type: spec
          required: true
        - type: acceptance-criteria
          required: true
        - type: decision-record
          required: false
        - type: mockup
          required: false
        - type: demo-scenarios
          required: false
      gate: {kind: person, approvers: members}
    - id: st_6ns22c4pav
      name: Build
      description: >-
        Agents change the code in the target's repositories so that it meets the
        spec. The stage ends with the change committed on one branch in each repository.
      inputs: []
      sequence: []
      outputs: []
      gate: {kind: person, approvers: members}
    - id: st_m1mqbeywdg
      name: Verify
      description: >-
        Agents test the change against the acceptance criteria. The stage
        ends with the test results and the evidence, such as screenshots and a demo video.
      inputs: []
      sequence: []
      outputs: []
      gate: {kind: person, approvers: members}
    - id: st_k9kpv17xmy
      name: Release
      description: >-
        Agents send the change through the destination you connect, for example
        as a pull request in each repository. The stage ends when the destination has the
        change for each repository.
      inputs: []
      sequence: []
      outputs: []
      gate: {kind: person, approvers: members}
artifact_types:
  - name: acceptance-criteria
  - name: mockup
  - name: screenshot
  - name: demo-video
  - name: explainer
  - name: decision-record
  - name: change
  - name: spec
    base_view: document
    size_limit: 1048576
    max_files: 1
  - name: demo-scenarios
    base_view: document
    size_limit: 1048576
    max_files: 1
  - name: branch
    base_view: structured
    size_limit: 65536
    max_files: 1
    # The content of contracts/harness/v1/branch.schema.json in the qory repository.
    json_schema:
      {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "$id": "https://qory.dev/contracts/harness/v1/branch.schema.json",
        "title": "The branch format, version 1",
        "description": "A work item's branch and the commit in each repository: the file of a version of a structured artifact type branch.",
        "type": "object",
        "required": ["ref", "repositories"],
        "additionalProperties": false,
        "properties": {
          "ref": {"description": "The branch's name, the same in each repository: qory/ followed by the work item's id.", "type": "string", "pattern": "^qory/wi_[A-Za-z0-9_-]{1,64}$"},
          "repositories": {
            "description": "Each repository with the commit of the branch in it, at least one.",
            "type": "array",
            "minItems": 1,
            "items": {
              "type": "object",
              "required": ["system", "path", "commit"],
              "additionalProperties": false,
              "properties": {
                "system": {"description": "The host the repository is on, such as github.com: a lower-case host name of at most 253 characters.", "type": "string", "pattern": "^[a-z0-9.-]{0,252}[a-z0-9-]$"},
                "path": {
                  "description": "The repository's path on the host, such as acme/web: at most 200 characters of segments joined by slashes, with no ., .. or .git segment.",
                  "type": "string",
                  "maxLength": 200,
                  "pattern": "^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$",
                  "not": {"pattern": "(^|/)(\\.\\.?|\\.[Gg][Ii][Tt])(/|$)"}
                },
                "commit": {"description": "A full commit id: 40 or 64 lower-case hexadecimal digits.", "type": "string", "pattern": "^([0-9a-f]{40}|[0-9a-f]{64})$"}
              }
            }
          }
        }
      }
