apiVersion: qory.dev/v1alpha1
name: Software factory
summary: Agents change code in your repositories. Each ticket needs a repository.
description: |-
  Each ticket comes from a work source, such as an issue tracker. Agents take the ticket through the stages, and at the end of each stage a member approves the result before the next stage starts. Changes go to your repositories through the destination you connect.

  You connect: where work comes from, where changes go, and a model.
type: qory.software
stack: software
process:
  schema: qory.process/v1
  machine: default
  tracks:
    - id: standard
      name: Standard
      description: >-
        Shape writes a spec and acceptance criteria. Build then plans, tests and reviews
        the change in up to 3 rounds.
  stages:
    - id: st_r79kph11eg
      name: Explore
      description: >-
        Agents read the ticket and its comments, read the destinations that the ticket
        concerns, and write questions for members about what the ticket leaves open. The
        stage ends with a proposal: the general direction for solving the ticket and the
        destinations it changes.
      inputs: []
      sequence:
        - workflow: explore-a-ticket
      outputs:
        - type: proposal
          required: true
      gate: {kind: person, approvers: members, tracks: [standard]}
    - id: st_p9w5cvh311
      name: Shape
      description: >-
        Agents turn the ticket and the proposal into a spec of the rules that change, and
        into acceptance criteria: at most seven statements of when the work is done. Where
        the change needs them, agents record technical decisions, draw mockups of changed
        screens, and write demo scenarios for what a person sees. The stage ends with a spec
        and acceptance criteria, plus any of those.
      inputs:
        - type: proposal
          required: false
      sequence:
        - workflow: shape-a-ticket
      outputs:
        - type: spec
          required: true
        - type: acceptance-criteria
          required: true
        - type: decision-record
          required: false
        - type: mockup
          required: false
        - type: demo-scenarios
          required: false
      gate: {kind: person, approvers: members}
    - id: st_6ns22c4pav
      name: Build
      description: >-
        Agents change the code in the target's repositories so that it meets the
        spec. The stage ends with the change committed on one branch in each repository.
      inputs: []
      sequence: []
      outputs:
        - type: pull-request
          required: true
      gate: {kind: person, approvers: members}
    - id: st_m1mqbeywdg
      name: Verify
      description: >-
        Agents test the change against the acceptance criteria. The stage
        ends with the test results and the evidence, such as screenshots and a demo video.
      inputs: []
      sequence: []
      outputs: []
      gate: {kind: person, approvers: members}
    - id: st_k9kpv17xmy
      name: Release
      description: >-
        Agents send the change through the destination you connect, for example
        as a pull request for the run's target. The stage ends when the destination has
        the change.
      inputs: []
      sequence: []
      outputs: []
      gate: {kind: person, approvers: members}
artifact_types:
  - name: acceptance-criteria
  - name: verification
  - name: mockup
  - name: screenshot
  - name: demo-video
  - name: walkthrough
  - name: decision-record
  - name: proposal
  - name: spec
    base_view: document
    size_limit: 1048576
    max_files: 1
  - name: demo-scenarios
    base_view: document
    size_limit: 1048576
    max_files: 1
  - name: pull-request
    base_view: structured
    size_limit: 786432
    max_files: 1
    deliver: {send: after_gate}
    # The same JSON Schema is in running-a-software-workflow/schemas/pull-request.schema.json.
    json_schema:
      {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "title": "Pull request, version 1",
        "description": "The change of a Build run: title, text, commits and steps.",
        "type": "object",
        "required": [
          "target",
          "title",
          "text",
          "commits",
          "head",
          "base",
          "branch",
          "base_branch",
          "steps",
          "draft"
        ],
        "additionalProperties": false,
        "properties": {
          "target": {
            "title": "Target",
            "$ref": "#/$defs/reference"
          },
          "title": {
            "title": "Title",
            "$ref": "#/$defs/title"
          },
          "text": {
            "title": "Description",
            "$ref": "#/$defs/text"
          },
          "commits": {
            "title": "Commits",
            "type": "array",
            "minItems": 1,
            "items": {
              "$ref": "#/$defs/commit"
            },
            "x-qory-fill": "pushed-commits"
          },
          "head": {
            "title": "Head commit",
            "$ref": "#/$defs/commit",
            "x-qory-fill": "pushed-head"
          },
          "base": {
            "title": "Base commit",
            "$ref": "#/$defs/commit",
            "x-qory-fill": "pushed-base"
          },
          "branch": {
            "title": "Branch",
            "type": "string",
            "maxLength": 255,
            "pattern": "^[^\\x00-\\x20\\x7f~^:?*\\[\\\\/-][^\\x00-\\x20\\x7f~^:?*\\[\\\\]*$",
            "not": {
              "pattern": "\\.\\.|//|@\\{|(^|/)\\.|\\.lock(/|$)|[./]$|^@$"
            },
            "allOf": [
              {
                "$ref": "#/$defs/line"
              }
            ],
            "x-qory-fill": "pushed-branch"
          },
          "base_branch": {
            "title": "Base branch",
            "type": "string",
            "maxLength": 255,
            "pattern": "^[^\\x00-\\x20\\x7f~^:?*\\[\\\\/-][^\\x00-\\x20\\x7f~^:?*\\[\\\\]*$",
            "not": {
              "pattern": "\\.\\.|//|@\\{|(^|/)\\.|\\.lock(/|$)|[./]$|^@$"
            },
            "allOf": [
              {
                "$ref": "#/$defs/line"
              }
            ],
            "x-qory-fill": "pushed-base-branch"
          },
          "earlier_commits": {
            "title": "Earlier commits",
            "type": "integer",
            "minimum": 1,
            "x-qory-fill": "pushed-commits-left-out"
          },
          "steps": {
            "title": "Steps",
            "type": "array",
            "items": {
              "type": "object",
              "required": [
                "commit",
                "step"
              ],
              "additionalProperties": false,
              "properties": {
                "commit": {
                  "type": "string",
                  "pattern": "^([0-9a-f]{40}|[0-9a-f]{64})$"
                },
                "step": {
                  "type": "string",
                  "$ref": "#/$defs/line",
                  "minLength": 1,
                  "maxLength": 128
                }
              }
            }
          },
          "draft": {
            "title": "Draft",
            "type": "boolean",
            "const": true
          }
        },
        "$defs": {
          "line": {
            "$ref": "https://qory.dev/contracts/harness/v1/primitives.schema.json#/$defs/line"
          },
          "title": {
            "$ref": "https://qory.dev/contracts/harness/v1/primitives.schema.json#/$defs/title"
          },
          "text": {
            "$ref": "https://qory.dev/contracts/harness/v1/primitives.schema.json#/$defs/text",
            "not": {
              "pattern": "(^|\\n)<!-- qory:(start|end) -->"
            }
          },
          "reference": {
            "$ref": "https://qory.dev/contracts/harness/v1/primitives.schema.json#/$defs/reference"
          },
          "commit": {
            "description": "A commit: the repository is the collection, the commit id is the path.",
            "allOf": [
              {
                "$ref": "#/$defs/reference"
              },
              {
                "required": [
                  "address"
                ],
                "properties": {
                  "address": {
                    "properties": {
                      "path": {
                        "pattern": "^([0-9a-f]{40}|[0-9a-f]{64})$"
                      }
                    }
                  }
                }
              }
            ]
          }
        }
      }
  - name: build-plan
    base_view: document
    size_limit: 1048576
    max_files: 1
  - name: build-report
    base_view: document
    size_limit: 1048576
    max_files: 1
  - name: build-ledger
    base_view: structured
    size_limit: 1048576
    max_files: 1
    withdrawable: false
    # The same JSON Schema is in running-a-software-workflow/schemas/build-ledger.schema.json.
    json_schema:
      {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "title": "Build ledger, version 1",
        "description": "Build's steps with their input hashes, and escalations.",
        "type": "object",
        "required": [
          "steps",
          "escalations"
        ],
        "additionalProperties": false,
        "properties": {
          "steps": {
            "type": "array",
            "maxItems": 100,
            "items": {
              "$ref": "#/$defs/step"
            }
          },
          "escalations": {
            "type": "array",
            "maxItems": 20,
            "items": {
              "$ref": "#/$defs/escalation"
            }
          }
        },
        "$defs": {
          "step": {
            "type": "object",
            "required": [
              "id",
              "pass",
              "kind",
              "workflow",
              "inputs",
              "state",
              "base",
              "attempts",
              "replays",
              "started_at"
            ],
            "additionalProperties": false,
            "properties": {
              "id": {
                "type": "string",
                "maxLength": 64,
                "pattern": "^(plan|checks|small-change|deliverable:d-[1-9][0-9]{0,2}|fix:[a-z0-9-]{1,40}|script:scenario-[1-9][0-9]?(#[23])?)$"
              },
              "pass": {
                "type": "integer",
                "minimum": 1,
                "maximum": 100
              },
              "kind": {
                "enum": [
                  "plan",
                  "checks",
                  "deliverable",
                  "fix",
                  "script",
                  "small-change"
                ]
              },
              "workflow": {
                "$ref": "#/$defs/workflow"
              },
              "inputs": {
                "$ref": "#/$defs/sha256"
              },
              "state": {
                "enum": [
                  "running",
                  "done",
                  "failed"
                ]
              },
              "base": {
                "$ref": "#/$defs/commit"
              },
              "commit": {
                "$ref": "#/$defs/commit"
              },
              "script_sha256": {
                "$ref": "#/$defs/sha256"
              },
              "attempts": {
                "type": "array",
                "maxItems": 3,
                "items": {
                  "$ref": "#/$defs/attempt"
                }
              },
              "pushed": {
                "type": "array",
                "maxItems": 4,
                "items": {
                  "$ref": "#/$defs/version"
                }
              },
              "report": {
                "type": "string",
                "maxLength": 8192
              },
              "reply": {
                "type": "object",
                "required": [
                  "kind",
                  "reason"
                ],
                "additionalProperties": false,
                "properties": {
                  "kind": {
                    "enum": [
                      "fixed",
                      "disputed"
                    ]
                  },
                  "reason": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 2000
                  }
                }
              },
              "replays": {
                "type": "integer",
                "minimum": 0,
                "maximum": 100
              },
              "started_at": {
                "$ref": "#/$defs/time"
              },
              "ended_at": {
                "$ref": "#/$defs/time"
              }
            },
            "allOf": [
              {
                "if": {
                  "properties": {
                    "state": {
                      "const": "done"
                    }
                  }
                },
                "then": {
                  "required": [
                    "commit",
                    "ended_at"
                  ]
                }
              },
              {
                "if": {
                  "properties": {
                    "kind": {
                      "const": "script"
                    },
                    "state": {
                      "const": "done"
                    }
                  }
                },
                "then": {
                  "required": [
                    "script_sha256"
                  ]
                }
              }
            ]
          },
          "attempt": {
            "type": "object",
            "required": [
              "agent",
              "role",
              "tier",
              "model"
            ],
            "additionalProperties": false,
            "properties": {
              "agent": {
                "$ref": "#/$defs/name"
              },
              "role": {
                "$ref": "#/$defs/name"
              },
              "tier": {
                "enum": [
                  "light",
                  "balanced",
                  "thinking"
                ]
              },
              "model": {
                "type": "string",
                "minLength": 1,
                "maxLength": 100,
                "pattern": "^[!-~]+$"
              }
            }
          },
          "escalation": {
            "type": "object",
            "required": [
              "workflow",
              "reason",
              "at"
            ],
            "additionalProperties": false,
            "properties": {
              "workflow": {
                "$ref": "#/$defs/workflow"
              },
              "reason": {
                "enum": [
                  "short-path",
                  "plan-limit",
                  "ledger-full",
                  "check-judged-wrong",
                  "findings-open",
                  "preflight",
                  "no-agent",
                  "other"
                ]
              },
              "detail": {
                "type": "string",
                "maxLength": 1000
              },
              "at": {
                "$ref": "#/$defs/time"
              }
            }
          },
          "version": {
            "type": "object",
            "required": [
              "type",
              "name",
              "version"
            ],
            "additionalProperties": false,
            "properties": {
              "type": {
                "$ref": "#/$defs/name"
              },
              "name": {
                "$ref": "#/$defs/name"
              },
              "version": {
                "type": "integer",
                "minimum": 1,
                "maximum": 999999
              }
            }
          },
          "name": {
            "type": "string",
            "pattern": "^[a-z0-9]+(-[a-z0-9]+)*$",
            "maxLength": 32
          },
          "workflow": {
            "type": "string",
            "pattern": "^[a-z][a-z0-9-]{0,54}$"
          },
          "commit": {
            "type": "string",
            "pattern": "^([0-9a-f]{40}|[0-9a-f]{64})$"
          },
          "sha256": {
            "type": "string",
            "pattern": "^[0-9a-f]{64}$"
          },
          "time": {
            "type": "string",
            "format": "date-time",
            "maxLength": 40,
            "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}[Tt][0-9:.]+([Zz]|[+-][0-9]{2}:[0-9]{2})$"
          }
        }
      }
  - name: acceptance-lock
    base_view: structured
    size_limit: 1048576
    max_files: 1
    withdrawable: false
    # The same JSON Schema is in running-a-software-workflow/schemas/acceptance-lock.schema.json.
    json_schema:
      {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "title": "Acceptance lock, version 1",
        "description": "The hashes of the locked acceptance checks.",
        "type": "object",
        "required": [
          "criteria",
          "start_commit",
          "commit",
          "checks"
        ],
        "additionalProperties": false,
        "properties": {
          "criteria": {
            "type": "object",
            "required": [
              "version"
            ],
            "additionalProperties": false,
            "properties": {
              "version": {
                "type": "integer",
                "minimum": 1
              },
              "decision": {
                "type": "string",
                "minLength": 1,
                "maxLength": 64,
                "pattern": "^[A-Za-z0-9_-]+$"
              },
              "sha256": {
                "description": "The SHA-256 of each live criterion, by criterion id.",
                "type": "object"
              }
            }
          },
          "start_commit": {
            "$ref": "#/$defs/commit"
          },
          "commit": {
            "$ref": "#/$defs/commit"
          },
          "checks": {
            "type": "array",
            "minItems": 1,
            "maxItems": 50,
            "items": {
              "$ref": "#/$defs/check"
            }
          },
          "support": {
            "type": "array",
            "maxItems": 50,
            "items": {
              "$ref": "#/$defs/file"
            }
          }
        },
        "$defs": {
          "check": {
            "type": "object",
            "required": [
              "criterion",
              "path",
              "sha256",
              "command",
              "failed_with"
            ],
            "additionalProperties": false,
            "properties": {
              "criterion": {
                "type": "string",
                "pattern": "^ac-[1-9][0-9]{0,3}$"
              },
              "repository": {
                "type": "string",
                "maxLength": 200,
                "pattern": "^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$",
                "not": {
                  "pattern": "(^|/)\\.\\.?(/|$)"
                }
              },
              "path": {
                "$ref": "#/$defs/path"
              },
              "sha256": {
                "$ref": "#/$defs/sha256"
              },
              "criterion_sha256": {
                "$ref": "#/$defs/sha256"
              },
              "command": {
                "type": "string",
                "minLength": 1,
                "maxLength": 1000
              },
              "failed_with": {
                "type": "integer",
                "minimum": 1,
                "maximum": 255
              }
            }
          },
          "file": {
            "type": "object",
            "required": [
              "path",
              "sha256"
            ],
            "additionalProperties": false,
            "properties": {
              "repository": {
                "type": "string",
                "maxLength": 200,
                "pattern": "^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$",
                "not": {
                  "pattern": "(^|/)\\.\\.?(/|$)"
                }
              },
              "path": {
                "$ref": "#/$defs/path"
              },
              "sha256": {
                "$ref": "#/$defs/sha256"
              }
            }
          },
          "path": {
            "type": "string",
            "maxLength": 1000,
            "pattern": "^[^/\\s][^\\s]*$",
            "not": {
              "pattern": "(^|/)\\.\\.?(/|$)"
            },
            "allOf": [
              {
                "$ref": "#/$defs/line"
              }
            ]
          },
          "commit": {
            "type": "string",
            "pattern": "^([0-9a-f]{40}|[0-9a-f]{64})$"
          },
          "sha256": {
            "type": "string",
            "pattern": "^[0-9a-f]{64}$"
          },
          "line": {
            "description": "One line of text: no control character, no U+2028 or U+2029, and no Cf character but U+200C and U+200D (emoji joiners).",
            "type": "string",
            "pattern": "^[^\\x00-\\x1f\\x7f-\\x9f\u00ad\u0600-\u0605\u061c\u06dd\u070f\u0890\u0891\u08e2\u180e\u200b\u200e\u200f\u2028-\u202e\u2060-\u2064\u2066-\u206f\ufeff\ufff9-\ufffb\U000110bd\U000110cd\U00013430-\U0001343f\U0001bca0-\U0001bca3\U0001d173-\U0001d17a\U000e0001\U000e0020-\U000e007f]*$"
          }
        }
      }
  - name: demo-script
    base_view: structured
    size_limit: 1048576
    max_files: 1
    # The same JSON Schema is in running-a-software-workflow/schemas/demo-script.schema.json.
    json_schema:
      {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "title": "Demo script, version 1",
        "description": "The browser actions of one approved demo scenario.",
        "type": "object",
        "required": [
          "scenario",
          "title",
          "evidence",
          "source",
          "setup",
          "steps"
        ],
        "additionalProperties": false,
        "properties": {
          "scenario": {
            "type": "string",
            "pattern": "^scenario-[1-9][0-9]?$"
          },
          "title": {
            "type": "string",
            "$ref": "#/$defs/line",
            "minLength": 1,
            "maxLength": 500
          },
          "evidence": {
            "enum": [
              "film",
              "pictures"
            ]
          },
          "source": {
            "type": "object",
            "required": [
              "version"
            ],
            "additionalProperties": false,
            "properties": {
              "version": {
                "type": "integer",
                "minimum": 1
              }
            }
          },
          "setup": {
            "type": "array",
            "maxItems": 20,
            "items": {
              "$ref": "#/$defs/action"
            }
          },
          "steps": {
            "type": "array",
            "minItems": 1,
            "maxItems": 8,
            "items": {
              "$ref": "#/$defs/step"
            }
          }
        },
        "$defs": {
          "step": {
            "type": "object",
            "required": [
              "step",
              "title",
              "expected",
              "actions"
            ],
            "additionalProperties": false,
            "properties": {
              "step": {
                "type": "integer",
                "minimum": 1,
                "maximum": 8
              },
              "title": {
                "type": "string",
                "$ref": "#/$defs/line",
                "minLength": 1,
                "maxLength": 500
              },
              "expected": {
                "type": "string",
                "$ref": "#/$defs/line",
                "minLength": 1,
                "maxLength": 500
              },
              "actions": {
                "type": "array",
                "minItems": 1,
                "maxItems": 10,
                "items": {
                  "$ref": "#/$defs/action"
                }
              }
            }
          },
          "action": {
            "oneOf": [
              {
                "$ref": "#/$defs/open"
              },
              {
                "$ref": "#/$defs/click"
              },
              {
                "$ref": "#/$defs/type"
              },
              {
                "$ref": "#/$defs/press"
              },
              {
                "$ref": "#/$defs/wait"
              }
            ]
          },
          "open": {
            "required": [
              "do",
              "url"
            ],
            "properties": {
              "do": {
                "const": "open"
              },
              "url": {
                "type": "string",
                "minLength": 1,
                "maxLength": 2048,
                "pattern": "^\\S+$",
                "allOf": [
                  {
                    "$ref": "#/$defs/line"
                  }
                ]
              }
            },
            "type": "object",
            "additionalProperties": false
          },
          "click": {
            "required": [
              "do",
              "target"
            ],
            "properties": {
              "do": {
                "const": "click"
              },
              "target": {
                "$ref": "#/$defs/target"
              }
            },
            "type": "object",
            "additionalProperties": false
          },
          "type": {
            "required": [
              "do",
              "target"
            ],
            "properties": {
              "do": {
                "const": "type"
              },
              "target": {
                "$ref": "#/$defs/target"
              },
              "text": {
                "type": "string",
                "maxLength": 2000
              },
              "variable": {
                "type": "string",
                "pattern": "^[A-Z][A-Z0-9_]{0,63}$"
              }
            },
            "oneOf": [
              {
                "required": [
                  "text"
                ]
              },
              {
                "required": [
                  "variable"
                ]
              }
            ],
            "type": "object",
            "additionalProperties": false
          },
          "press": {
            "required": [
              "do",
              "key"
            ],
            "properties": {
              "do": {
                "const": "press"
              },
              "key": {
                "type": "string",
                "pattern": "^[A-Za-z0-9+]{1,40}$"
              }
            },
            "type": "object",
            "additionalProperties": false
          },
          "wait": {
            "required": [
              "do",
              "text"
            ],
            "properties": {
              "do": {
                "const": "wait"
              },
              "text": {
                "type": "string",
                "minLength": 1,
                "maxLength": 500
              },
              "timeout_ms": {
                "type": "integer",
                "minimum": 1,
                "maximum": 60000
              }
            },
            "type": "object",
            "additionalProperties": false
          },
          "target": {
            "type": "string",
            "minLength": 1,
            "maxLength": 500
          },
          "line": {
            "description": "One line of text: no control character, no U+2028 or U+2029, and no Cf character but U+200C and U+200D (emoji joiners).",
            "type": "string",
            "pattern": "^[^\\x00-\\x1f\\x7f-\\x9f\u00ad\u0600-\u0605\u061c\u06dd\u070f\u0890\u0891\u08e2\u180e\u200b\u200e\u200f\u2028-\u202e\u2060-\u2064\u2066-\u206f\ufeff\ufff9-\ufffb\U000110bd\U000110cd\U00013430-\U0001343f\U0001bca0-\U0001bca3\U0001d173-\U0001d17a\U000e0001\U000e0020-\U000e007f]*$"
          }
        }
      }
  - name: demo-evidence
    base_view: structured
    size_limit: 1048576
    max_files: 1
    # The same JSON Schema is in running-a-software-workflow/schemas/demo-evidence.schema.json.
    json_schema:
      {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "title": "Demo evidence, version 1",
        "description": "One demo scenario's verdict on one commit.",
        "type": "object",
        "required": [
          "scenario",
          "title",
          "commit",
          "planned",
          "evidence",
          "verdict",
          "script",
          "steps"
        ],
        "additionalProperties": false,
        "properties": {
          "scenario": {
            "type": "string",
            "pattern": "^scenario-[1-9][0-9]?$"
          },
          "title": {
            "type": "string",
            "$ref": "#/$defs/line",
            "minLength": 1,
            "maxLength": 500
          },
          "commit": {
            "$ref": "#/$defs/commit"
          },
          "planned": {
            "enum": [
              "film",
              "pictures"
            ]
          },
          "evidence": {
            "enum": [
              "film",
              "pictures",
              "none"
            ]
          },
          "verdict": {
            "enum": [
              "passed",
              "failed"
            ]
          },
          "class": {
            "enum": [
              "product",
              "script",
              "setup"
            ]
          },
          "script": {
            "$ref": "#/$defs/version"
          },
          "media": {
            "$ref": "#/$defs/version"
          },
          "steps": {
            "type": "array",
            "minItems": 1,
            "maxItems": 8,
            "items": {
              "$ref": "#/$defs/step"
            }
          }
        },
        "allOf": [
          {
            "if": {
              "properties": {
                "verdict": {
                  "const": "failed"
                }
              }
            },
            "then": {
              "required": [
                "class"
              ]
            }
          },
          {
            "if": {
              "properties": {
                "evidence": {
                  "enum": [
                    "film",
                    "pictures"
                  ]
                }
              }
            },
            "then": {
              "required": [
                "media"
              ]
            }
          }
        ],
        "$defs": {
          "step": {
            "type": "object",
            "required": [
              "step",
              "title",
              "expected",
              "verdict",
              "frames"
            ],
            "additionalProperties": false,
            "properties": {
              "step": {
                "type": "integer",
                "minimum": 1,
                "maximum": 8
              },
              "title": {
                "type": "string",
                "$ref": "#/$defs/line",
                "minLength": 1,
                "maxLength": 500
              },
              "expected": {
                "type": "string",
                "$ref": "#/$defs/line",
                "minLength": 1,
                "maxLength": 500
              },
              "verdict": {
                "enum": [
                  "passed",
                  "failed",
                  "not-reached"
                ]
              },
              "frames": {
                "type": "array",
                "maxItems": 2,
                "items": {
                  "$ref": "#/$defs/frame"
                }
              },
              "finding": {
                "type": "string",
                "maxLength": 2000
              }
            }
          },
          "frame": {
            "type": "object",
            "required": [
              "at"
            ],
            "additionalProperties": false,
            "properties": {
              "at": {
                "enum": [
                  "start",
                  "reached"
                ]
              },
              "time_ms": {
                "type": "integer",
                "minimum": 0
              },
              "file": {
                "type": "string",
                "pattern": "^scenario-[1-9][0-9]?-step-[1-8]\\.png$"
              }
            }
          },
          "version": {
            "type": "object",
            "required": [
              "type",
              "name",
              "version"
            ],
            "additionalProperties": false,
            "properties": {
              "type": {
                "$ref": "#/$defs/name"
              },
              "name": {
                "$ref": "#/$defs/name"
              },
              "version": {
                "type": "integer",
                "minimum": 1,
                "maximum": 999999
              }
            }
          },
          "name": {
            "type": "string",
            "pattern": "^[a-z0-9]+(-[a-z0-9]+)*$",
            "maxLength": 64
          },
          "commit": {
            "type": "string",
            "pattern": "^([0-9a-f]{40}|[0-9a-f]{64})$"
          },
          "line": {
            "description": "One line of text: no control character, no U+2028 or U+2029, and no Cf character but U+200C and U+200D (emoji joiners).",
            "type": "string",
            "pattern": "^[^\\x00-\\x1f\\x7f-\\x9f\u00ad\u0600-\u0605\u061c\u06dd\u070f\u0890\u0891\u08e2\u180e\u200b\u200e\u200f\u2028-\u202e\u2060-\u2064\u2066-\u206f\ufeff\ufff9-\ufffb\U000110bd\U000110cd\U00013430-\U0001343f\U0001bca0-\U0001bca3\U0001d173-\U0001d17a\U000e0001\U000e0020-\U000e007f]*$"
          }
        }
      }
  - name: feedback
    base_view: structured
    size_limit: 1048576
    max_files: 1
    withdrawable: false
    # The same JSON Schema is in running-a-software-workflow/schemas/feedback.schema.json.
    json_schema:
      {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "title": "Feedback",
        "description": "What people asked for after they saw the change, sorted into points. A version keeps every source and point of the version before it.",
        "type": "object",
        "required": [
          "sources",
          "points"
        ],
        "additionalProperties": false,
        "properties": {
          "sources": {
            "type": "array",
            "minItems": 1,
            "maxItems": 500,
            "items": {
              "$ref": "#/$defs/source"
            }
          },
          "points": {
            "type": "array",
            "maxItems": 999,
            "items": {
              "$ref": "#/$defs/point"
            }
          }
        },
        "$defs": {
          "source": {
            "type": "object",
            "required": [
              "kind",
              "id",
              "at",
              "text"
            ],
            "additionalProperties": false,
            "properties": {
              "kind": {
                "enum": [
                  "note",
                  "comment",
                  "answer"
                ]
              },
              "id": {
                "$ref": "#/$defs/source_id"
              },
              "at": {
                "type": "string",
                "format": "date-time",
                "maxLength": 40,
                "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}[Tt][0-9:.]+([Zz]|[+-][0-9]{2}:[0-9]{2})$"
              },
              "by": {
                "type": "string",
                "$ref": "#/$defs/line",
                "minLength": 1,
                "maxLength": 500
              },
              "text": {
                "type": "string",
                "$ref": "https://qory.dev/contracts/harness/v1/primitives.schema.json#/$defs/text",
                "minLength": 1
              }
            }
          },
          "point": {
            "type": "object",
            "required": [
              "id",
              "source",
              "quote",
              "sort",
              "change"
            ],
            "additionalProperties": false,
            "properties": {
              "id": {
                "type": "string",
                "pattern": "^p[1-9][0-9]{0,2}$"
              },
              "source": {
                "$ref": "#/$defs/source_id"
              },
              "quote": {
                "type": "string",
                "$ref": "https://qory.dev/contracts/harness/v1/primitives.schema.json#/$defs/text",
                "minLength": 1
              },
              "sort": {
                "enum": [
                  "fix",
                  "criterion-change",
                  "question"
                ]
              },
              "output": {
                "enum": [
                  "acceptance-criteria",
                  "demo-scenarios"
                ]
              },
              "item": {
                "type": "string",
                "pattern": "^(ac|scenario)-[1-9][0-9]{0,3}$"
              },
              "change": {
                "type": "string",
                "$ref": "#/$defs/line",
                "minLength": 1,
                "maxLength": 500
              },
              "reply": {
                "type": "string",
                "$ref": "#/$defs/line",
                "minLength": 1,
                "maxLength": 1000
              },
              "question": {
                "type": "string",
                "pattern": "^q[1-9][0-9]{0,3}$"
              }
            }
          },
          "source_id": {
            "description": "The id of the note: gd_, es_ or rc_ of a note, an_ of an answer. A comment or a reply with no id has cm_ and the first 16 hexadecimal digits of the SHA-256 of its at, a line feed and its text.",
            "type": "string",
            "pattern": "^(gd|es|an|rc)_[0-9a-z]{1,32}$|^cm_[0-9a-f]{16}$"
          },
          "line": {
            "$ref": "https://qory.dev/contracts/harness/v1/primitives.schema.json#/$defs/line"
          }
        }
      }
