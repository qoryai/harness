              },
              "version": {
                "type": "integer",
                "minimum": 1,
                "maximum": 999999
              }
            }
          },
          "name": {
            "type": "string",
            "pattern": "^[a-z0-9]+(-[a-z0-9]+)*$",
            "maxLength": 64
          },
          "commit": {
            "type": "string",
            "pattern": "^([0-9a-f]{40}|[0-9a-f]{64})$"
          }
        }
