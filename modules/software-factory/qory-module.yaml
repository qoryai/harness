apiVersion: qory.dev/v1alpha1
name: software-factory
description: >-
  The software factory: process.yaml, the process template that a software-factory workspace
  starts with; the workflow-explore-a-ticket skill, which orchestrates one ticket's
  exploration in a headless run: it starts agents, decides on each finding, and pushes a
  proposal, questions and replies to review comments; the skills writing-proposals,
  checking-proposals and exploring-code; the agents code-explorer, proposal-writer and
  proposal-reviewer; the workflow-write-specs skill, which orchestrates one ticket's spec and
  acceptance criteria; the skill running-a-software-workflow, which a small workflow's session
  loads after running-a-workflow of core, and whose workflow-checks.cjs adds the checks of the
  software documents and of the types of Build and Verify, and is the program of each push
  check; the skill running-checks, with the verbs run, scope, freeze, diff, probe and
  prove of the checks script, where prove takes --inputs, --base and --artifacts; the skills
  writing-specs and checking-specs; the agents spec-writer and
  spec-reviewer; the workflow-write-technical-decisions skill, which orchestrates one ticket's
  decision record; the skills writing-decisions and checking-decisions; the agents
  decision-writer and decision-reviewer; the workflow-make-mockups skill, which orchestrates
  one ticket's clickable mockup; the skills designing-mockups, which has the render script,
  and checking-mockups; the agents designer and mockup-reviewer; the
  workflow-write-demo-scenarios skill, which orchestrates one ticket's demo scenarios; the
  skills writing-demo-scenarios and checking-demo-scenarios; the agents scenario-writer and
  scenario-reviewer; the workflow-shape-a-ticket skill, which orchestrates one ticket's Shape
  stage through those four workflows; the skills planning-shape and checking-shape; the agents
  shape-planner and shape-reviewer; the workflow-plan-the-build skill, which orchestrates
  one ticket's build plan; the skills planning-builds and checking-build-plans; the skill
  judging-findings, which defines a blocking finding of a change; the agents build-planner and
  plan-reviewer; the workflow-write-acceptance-checks skill, which orchestrates one ticket's
  acceptance checks and their lock; the skills writing-acceptance-checks and
  checking-acceptance-checks; the agents acceptance-check-writer and check-reviewer; the
  workflow-review-changes skill, which checks one ticket's Build run before its review round
  and, when every check passed, starts submission-writer; the skills checking-code,
  checking-tests, checking-acceptance and writing-submissions; the agents code-reviewer,
  test-reviewer and acceptance-reviewer, the reviewers of that round; the agent
  submission-writer, which writes the title and the text of the draft pull request;
  the skills checking-security, checking-data-changes and checking-failure-handling; the
  agents security-reviewer, data-reviewer and failure-reviewer, the members of the group
  role reviewers, which start only for a change in their paths; and live web search off on
  Codex.
roles:
  agents:
    reviewers: many
provides:
  agents:
    explorer: code-explorer
    spec-review: spec-reviewer
    # shortcut: the paths of the three agents match path names and case, read no file and
    # cannot leave one out, so a text file in a listed folder starts a reviewer; replace the
    # globs when a change shows this costs a review.
    reviewers: [security-reviewer, data-reviewer, failure-reviewer]
push_checks:
  - type: proposal
    command: [skills/running-a-software-workflow/workflow-checks.cjs, push, proposal]
  - type: spec
    command: [skills/running-a-software-workflow/workflow-checks.cjs, push, spec]
  - type: acceptance-criteria
    command: [skills/running-a-software-workflow/workflow-checks.cjs, push, acceptance-criteria]
  - type: decision-record
    command: [skills/running-a-software-workflow/workflow-checks.cjs, push, decision-record]
    reads: [acceptance-criteria, questions]
  - type: demo-scenarios
    command: [skills/running-a-software-workflow/workflow-checks.cjs, push, demo-scenarios]
    reads: [acceptance-criteria]
  - type: pull-request
    command: [skills/running-a-software-workflow/workflow-checks.cjs, push, pull-request]
  - type: build-plan
    command: [skills/running-a-software-workflow/workflow-checks.cjs, push, build-plan]
    reads: [acceptance-criteria]
  - type: build-report
    command: [skills/running-a-software-workflow/workflow-checks.cjs, push, build-report]
  - type: build-ledger
    command: [skills/running-a-software-workflow/workflow-checks.cjs, push, build-ledger]
  - type: acceptance-lock
    command: [skills/running-a-software-workflow/workflow-checks.cjs, push, acceptance-lock]
    reads: [acceptance-criteria]
  - type: demo-script
    command: [skills/running-a-software-workflow/workflow-checks.cjs, push, demo-script]
    reads: [demo-scenarios]
  - type: demo-evidence
    command: [skills/running-a-software-workflow/workflow-checks.cjs, push, demo-evidence]
    reads: [demo-script]
  - type: demo-video
    command: [skills/running-a-software-workflow/workflow-checks.cjs, push, demo-video]
    reads: [demo-script]
  - type: screenshot
    command: [skills/running-a-software-workflow/workflow-checks.cjs, push, screenshot]
    reads: [demo-script]
  - type: verification
    command: [skills/running-a-software-workflow/workflow-checks.cjs, push, verification]
    reads: [acceptance-criteria]
  - type: walkthrough
    command: [skills/running-a-software-workflow/workflow-checks.cjs, push, walkthrough]
    reads: [verification, acceptance-criteria]
