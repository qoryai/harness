apiVersion: qory.dev/v1alpha1
name: software-factory
description: >-
  The software factory: process.yaml, the process template that a software-factory
  workspace starts with; the workflow-explore-a-ticket skill, which explores one ticket in a
  headless run from the input file, the work item's artifacts and the target's files,
  read-only, and pushes a proposal, questions and replies to review comments; the skills
  writing-proposals, checking-proposals and exploring-code; and the agents code-explorer
  and proposal-reviewer.
