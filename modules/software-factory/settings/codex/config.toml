# The Codex settings of the software-factory module. qory writes them into the run's
# $CODEX_HOME/config.toml. They set no model, no provider and no sandbox or approval mode:
# the stack's target and the launch set those.

# Live web search stays off. Codex turns it on under full access unless this key is set.
web_search = "disabled"

# The end check: Codex runs this hook when the session tries to end. Exit status 2 with
# text on stderr keeps the session going, and Codex passes the text to the model. A hook
# in $CODEX_HOME runs only when its hash is trusted. qory writes this hook's trusted_hash
# into the run's read-only config.toml and starts Codex without
# --dangerously-bypass-hook-trust, because that flag also trusts hooks that the agent
# writes. This file sets no hooks.state: qory reserves it.
[[hooks.Stop]]
[[hooks.Stop.hooks]]
type = "command"
command = "node \"$QORY_HARNESS_HOME/hooks/end-gate-codex.js\""
timeout = 180
