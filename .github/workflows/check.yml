name: Check

# Only a pull request starts a run, so a push to a branch without a pull request
# uses no CI minutes.
on:
  pull_request:

permissions:
  contents: read

# A newer push to a pull request cancels the run of that pull request that is in
# progress or waiting.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: scripts/check.sh
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # qory's commit to build. v0.13.0, the newest release, refuses the `workflows`
      # key in stacks/software/qory-stack.yaml, the `push_checks` key in
      # modules/software-factory/qory-module.yaml and the `withdrawable` key in
      # modules/software-factory/process.yaml, has no `--points` on
      # `qory run verdict escalate`, which the workflow skills run, has no `--track` on
      # `qory run verdict`, which the Explore session runs, and has no `fix` on a point of a
      # verdict. The compose of that release, and of qory at 0e02282, also stops on the
      # `plan` key of a workflow in stacks/software/qory-stack.yaml and on the
      # `scope_checks` key in modules/software-factory/qory-module.yaml. This commit, on
      # qory's 544-build-verify branch, not main, has all eight, reads the `judges` key of
      # the implement-changes entry in stacks/software/qory-stack.yaml, writes
      # `web_search = "disabled"` into the `config.toml` of a Codex home, and posts the
      # findings of a review and the replies of the build ledger.
      # Its middle model tier is `balanced`, the tier of
      # modules/software-factory/agents/code-explorer.md. It has the contract's primitives,
      # verification and acceptance-criteria files, which scripts/check.sh compares byte for
      # byte with the copies in modules/software-factory/skills/running-a-software-workflow/
      # schemas/, and the checks of stage outputs that modules/software-factory/process.yaml
      # follows. Move to a release when one has them.
      QORY_COMMIT: 05ef56eb7e8e675b98a2bb4a222430706487c53c
      # qory's commit that the tests read the contract files from, such as
      # contracts/harness/v1/review-report.schema.json, and scripts/check.sh compares the
      # primitives, verification and acceptance-criteria files with. It is the commit of
      # QORY_COMMIT. The step "Fetch qory's contracts" sets QORY_SOURCE to the folder of that
      # commit.
      # scripts/findings.test.js reads this pin to name the commit in its error.
      QORY_CONTRACTS_COMMIT: 05ef56eb7e8e675b98a2bb4a222430706487c53c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.2"
          package-manager-cache: false

      - name: Install qory
        run: GOBIN="$RUNNER_TEMP/qory" go install "github.com/qoryai/qory@$QORY_COMMIT"

      - name: Fetch qory's contracts
        run: |
          go mod download -json "github.com/qoryai/qory@$QORY_CONTRACTS_COMMIT" \
            > "$RUNNER_TEMP/qory-contracts.json"
          dir=$(node -e '
            const got = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            if (!got.Dir) {
              console.error(got.Error || "go mod download printed no Dir");
              process.exit(1);
            }
            console.log(got.Dir);
          ' "$RUNNER_TEMP/qory-contracts.json")
          echo "QORY_SOURCE=$dir" >> "$GITHUB_ENV"

      # scripts/key-shapes.test.js compares the key shapes of running-a-software-workflow with
      # Forager's contracts, at the Forager version that qory's go.mod pins, or its replace.
      - name: Fetch Forager's contracts
        run: |
          module=$(go mod edit -json "$QORY_SOURCE/go.mod" | node -e '
            const mod = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const name = "github.com/qoryai/forager";
            const swap = (mod.Replace || []).find((one) => one.Old.Path === name);
            const pin = swap ? swap.New : (mod.Require || []).find((one) => one.Path === name);
            if (!pin || !pin.Version) {
              console.error(`qory go.mod pins no version of ${name}`);
              process.exit(1);
            }
            console.log(`${pin.Path}@${pin.Version}`);
          ')
          go mod download -json "$module" > "$RUNNER_TEMP/forager-contracts.json"
          dir=$(node -e '
            const got = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            if (!got.Dir) {
              console.error(got.Error || "go mod download printed no Dir");
              process.exit(1);
            }
            console.log(got.Dir);
          ' "$RUNNER_TEMP/forager-contracts.json")
          echo "FORAGER_SOURCE=$dir" >> "$GITHUB_ENV"

      # scripts/hook-commands.js runs shellcheck on the hook commands of core. The step fails
      # when shellcheck is missing, because GitHub Actions sets CI=true. The checks pass on
      # shellcheck 0.9.0 and 0.11.0.
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Check
        run: QORY="$RUNNER_TEMP/qory/qory" sh scripts/check.sh
