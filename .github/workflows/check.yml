name: Check

# Only a pull request starts a run, so a push to a branch without a pull request
# uses no CI minutes.
on:
  pull_request:

permissions:
  contents: read

# A newer push to a pull request cancels the run of that pull request that is in
# progress or waiting.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: scripts/check.sh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # qory's commit to build. v0.13.0, the newest release, refuses the `workflows`
      # key in stacks/software/qory-stack.yaml and the `push_checks` key in
      # modules/software-factory/qory-module.yaml, so the check builds this commit, qory's
      # main after qoryai/qory#74. Move to a release once one reads both keys.
      QORY_COMMIT: 4314dbb8197e408ee363db7b5216403d95a960fb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.2"
          package-manager-cache: false

      - name: Install qory
        run: GOBIN="$RUNNER_TEMP/qory" go install "github.com/qoryai/qory@$QORY_COMMIT"

      - name: Check
        run: QORY="$RUNNER_TEMP/qory/qory" sh scripts/check.sh
