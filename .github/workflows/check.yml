name: Check

# Only a pull request starts a run, so a push to a branch without a pull request
# uses no CI minutes.
on:
  pull_request:

permissions:
  contents: read

# A newer push to a pull request cancels the run of that pull request that is in
# progress or waiting.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: scripts/check.sh
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # qory's commit to build. v0.13.0, the newest release, refuses the `workflows`
      # key in stacks/software/qory-stack.yaml, the `push_checks` key in
      # modules/software-factory/qory-module.yaml and the `withdrawable` key in
      # modules/software-factory/process.yaml, has no `--points` on
      # `qory run verdict escalate`, which the workflow skills run, has no `--track` on
      # `qory run verdict`, which the Explore session runs, and has no `fix` on a point of a
      # verdict. This commit, the merge of qoryai/qory#127 into qory's 544-build-verify
      # branch, not main, has all six, and its middle model tier is `balanced`, the tier of
      # modules/software-factory/agents/code-explorer.md. It also has the contract's
      # acceptance criteria and verification formats and `about` on each question, which
      # modules/software-factory/process.yaml and the questions check follow. Move to a
      # release when one has them.
      QORY_COMMIT: 0e022820ca3f3725b9a6a31b39d20424f2b33076
      # qory's commit that the tests read the contract files from, such as
      # contracts/harness/v1/review-report.schema.json. It is the merge of qoryai/qory#136
      # into qory's 544-build-verify branch, which publishes that schema; QORY_COMMIT does
      # not have it. The step "Fetch qory's contracts" sets QORY_SOURCE to the folder of
      # that commit. scripts/findings.test.js reads this pin to name the commit in its error.
      QORY_CONTRACTS_COMMIT: afee80c313bda3e75b8508bf3c6bf7e557a903db
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.2"
          package-manager-cache: false

      - name: Install qory
        run: GOBIN="$RUNNER_TEMP/qory" go install "github.com/qoryai/qory@$QORY_COMMIT"

      - name: Fetch qory's contracts
        run: |
          go mod download -json "github.com/qoryai/qory@$QORY_CONTRACTS_COMMIT" \
            > "$RUNNER_TEMP/qory-contracts.json"
          dir=$(node -e '
            const got = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            if (!got.Dir) {
              console.error(got.Error || "go mod download printed no Dir");
              process.exit(1);
            }
            console.log(got.Dir);
          ' "$RUNNER_TEMP/qory-contracts.json")
          echo "QORY_SOURCE=$dir" >> "$GITHUB_ENV"

      - name: Check
        run: QORY="$RUNNER_TEMP/qory/qory" sh scripts/check.sh
