apiVersion: qory.dev/v1alpha1
name: software
description: The software factory harness, for a checkout to extend
modules:
  - name: core
  - name: software-factory
workflows:
  explore-a-ticket: {tier: thinking, access: read}
  write-specs: {tier: thinking, access: read}
  write-technical-decisions: {tier: thinking, access: read}
  make-mockups: {tier: balanced, access: read}
  write-demo-scenarios: {tier: balanced, access: read}
  shape-a-ticket: {tier: thinking, access: read}
  plan-the-build: {tier: thinking, access: write, plan: build-plan}
  write-acceptance-checks: {tier: balanced, access: write, plan: build-plan}
  review-changes: {tier: thinking, access: read}
extending:
  kinds: [skills, agents, commands, output-styles]
  instructions: true
  # permissions.allow and permissions.deny are key paths of Claude Code's settings.
  settings: [permissions.allow, permissions.deny]
